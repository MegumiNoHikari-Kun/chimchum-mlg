<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ChimChum Malang - Login</title>

    <link
        rel="icon"
        type="image/jpeg"
        href="./assets/logo-transparan.png"
        onerror="this.src='https://placehold.co/50?text=CC'"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }

        .hidden-force {
            display: none !important;
        }

        .spinner {
            width: 22px;
            height: 22px;
            border: 3px solid rgba(255,255,255,.35);
            border-top-color: white;
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }

        .spinner-dark {
            width: 28px;
            height: 28px;
            border: 3px solid #e2e8f0;
            border-top-color: #f97316;
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body class="bg-slate-100 text-slate-800 min-h-screen">

    <!-- AUTH LOADING -->
    <div
        id="authLoading"
        class="fixed inset-0 z-[9999] bg-slate-100 flex items-center justify-center"
    >
        <div class="text-center">
            <div class="spinner-dark mx-auto mb-4"></div>

            <h2 class="font-semibold text-slate-700">
                Memeriksa sesi login...
            </h2>

            <p class="text-sm text-slate-500 mt-1">
                Mohon tunggu sebentar
            </p>
        </div>
    </div>


    <!-- LOGIN -->
    <section
        id="loginScreen"
        class="hidden-force min-h-screen flex items-center justify-center p-6"
    >

        <div class="w-full max-w-md">

            <!-- Logo -->
            <div class="text-center mb-8">

                <img
                    src="./assets/logo-transparan.png"
                    alt="ChimChum"
                    class="h-24 w-24 object-cover rounded-3xl mx-auto shadow-lg"
                    onerror="this.src='https://placehold.co/100?text=CC'"
                >

                <h1 class="text-2xl font-bold text-orange-600 mt-5">
                    ChimChum Malang
                </h1>

                <p class="text-sm text-slate-500 mt-1">
                    Management System
                </p>

            </div>


            <!-- LOGIN CARD -->
            <div class="bg-white rounded-3xl shadow-xl border border-slate-200 p-7">

                <div class="mb-6">

                    <div class="w-12 h-12 rounded-2xl bg-orange-100 text-orange-600 flex items-center justify-center mb-4">
                        <i class="fa-solid fa-lock text-xl"></i>
                    </div>

                    <h2 class="text-xl font-bold text-slate-800">
                        Login
                    </h2>

                    <p class="text-sm text-slate-500 mt-1">
                        Masuk menggunakan akun ChimChum.
                    </p>

                </div>


                <!-- ERROR -->
                <div
                    id="loginError"
                    class="hidden mb-5 p-3.5 rounded-xl bg-red-50 border border-red-200 text-red-700 text-sm"
                >
                    <div class="flex items-start gap-2">
                        <i class="fa-solid fa-circle-exclamation mt-0.5"></i>

                        <span id="loginErrorText"></span>
                    </div>
                </div>


                <!-- FORM -->
                <form id="loginForm" class="space-y-5">

                    <!-- EMAIL -->
                    <div>

                        <label
                            for="loginEmail"
                            class="block text-sm font-semibold text-slate-700 mb-2"
                        >
                            Email
                        </label>

                        <div class="relative">

                            <i class="fa-solid fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>

                            <input
                                id="loginEmail"
                                type="email"
                                autocomplete="email"
                                required
                                placeholder="nama@email.com"
                                class="w-full pl-11 pr-4 py-3.5 border border-slate-300 rounded-xl outline-none focus:ring-2 focus:ring-orange-500 focus:border-orange-500 transition"
                            >

                        </div>
                    </div>


                    <!-- PASSWORD -->
                    <div>

                        <label
                            for="loginPassword"
                            class="block text-sm font-semibold text-slate-700 mb-2"
                        >
                            Password
                        </label>

                        <div class="relative">

                            <i class="fa-solid fa-key absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>

                            <input
                                id="loginPassword"
                                type="password"
                                autocomplete="current-password"
                                required
                                placeholder="Masukkan password"
                                class="w-full pl-11 pr-12 py-3.5 border border-slate-300 rounded-xl outline-none focus:ring-2 focus:ring-orange-500 focus:border-orange-500 transition"
                            >

                            <button
                                type="button"
                                id="togglePassword"
                                class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-orange-600"
                            >
                                <i
                                    id="togglePasswordIcon"
                                    class="fa-solid fa-eye"
                                ></i>
                            </button>

                        </div>
                    </div>


                    <!-- BUTTON -->
                    <button
                        id="loginButton"
                        type="submit"
                        class="w-full bg-orange-500 hover:bg-orange-600 active:bg-orange-700 text-white font-semibold py-3.5 rounded-xl transition flex items-center justify-center gap-3 shadow-lg shadow-orange-500/20"
                    >

                        <span id="loginButtonText">
                            <i class="fa-solid fa-right-to-bracket mr-2"></i>
                            Masuk
                        </span>

                        <span
                            id="loginSpinner"
                            class="spinner hidden-force"
                        ></span>

                    </button>

                </form>


                <div class="mt-6 pt-5 border-t border-slate-100 text-center">

                    <p class="text-xs text-slate-400">
                        <i class="fa-solid fa-shield-halved mr-1"></i>
                        Silakan login untuk mengakses sistem.
                    </p>

                </div>

            </div>

        </div>

    </section>


    <script type="module" src="./js/module/login.js"></script>

</body>
</html>
