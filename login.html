<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ChimChum Malang - Login</title>

    <link
        rel="icon"
        type="image/jpeg"
        href="./assets/logo-transparan.png"
        onerror="this.src='https://placehold.co/50?text=CC'"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }

        .hidden-force {
            display: none !important;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.35);
            border-top-color: white;
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }

        .spinner-dark {
            width: 24px;
            height: 24px;
            border: 3px solid #e2e8f0;
            border-top-color: #f97316;
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body class="bg-slate-100 text-slate-800 min-h-screen">

    <!-- AUTH LOADING -->
    <div
        id="authLoading"
        class="fixed inset-0 z-[9999] bg-slate-100 flex items-center justify-center"
    >
        <div class="text-center">
            <div class="spinner-dark mx-auto mb-3"></div>

            <p class="text-sm font-medium text-slate-600">
                Memeriksa sesi...
            </p>
        </div>
    </div>


    <!-- LOGIN -->
    <section
        id="loginScreen"
        class="hidden-force min-h-screen flex items-center justify-center px-4 py-6"
    >

        <div class="w-full max-w-sm">

            <!-- BRAND -->
            <div class="text-center mb-5">

                <img
                    src="./assets/logo-transparan.png"
                    alt="ChimChum"
                    class="h-16 w-16 object-cover rounded-2xl mx-auto shadow-md"
                    onerror="this.src='https://placehold.co/80?text=CC'"
                >

                <h1 class="text-xl font-bold text-orange-600 mt-3">
                    ChimChum Malang
                </h1>

                <p class="text-xs text-slate-500 mt-0.5">
                    Management System
                </p>

            </div>


            <!-- LOGIN CARD -->
            <div class="bg-white rounded-2xl shadow-lg border border-slate-200 p-5">

                <div class="mb-4">
                    <h2 class="text-lg font-bold text-slate-800">
                        Masuk
                    </h2>

                    <p class="text-xs text-slate-500 mt-0.5">
                        Silakan masuk menggunakan akun Anda.
                    </p>
                </div>


                <!-- ERROR -->
                <div
                    id="loginError"
                    class="hidden mb-4 p-3 rounded-lg bg-red-50 border border-red-200 text-red-700 text-xs"
                >
                    <div class="flex items-start gap-2">
                        <i class="fa-solid fa-circle-exclamation mt-0.5"></i>

                        <span id="loginErrorText"></span>
                    </div>
                </div>


                <!-- FORM -->
                <form id="loginForm" class="space-y-3.5">

                    <!-- EMAIL -->
                    <div>

                        <label
                            for="loginEmail"
                            class="block text-xs font-semibold text-slate-700 mb-1.5"
                        >
                            Email
                        </label>

                        <div class="relative">

                            <i
                                class="fa-solid fa-envelope absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"
                            ></i>

                            <input
                                id="loginEmail"
                                type="email"
                                autocomplete="email"
                                required
                                placeholder="nama@email.com"
                                class="w-full pl-10 pr-3 py-2.5 text-sm border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-orange-500 focus:border-orange-500 transition"
                            >

                        </div>
                    </div>


                    <!-- PASSWORD -->
                    <div>

                        <label
                            for="loginPassword"
                            class="block text-xs font-semibold text-slate-700 mb-1.5"
                        >
                            Password
                        </label>

                        <div class="relative">

                            <i
                                class="fa-solid fa-key absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"
                            ></i>

                            <input
                                id="loginPassword"
                                type="password"
                                autocomplete="current-password"
                                required
                                placeholder="Masukkan password"
                                class="w-full pl-10 pr-10 py-2.5 text-sm border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-orange-500 focus:border-orange-500 transition"
                            >

                            <button
                                type="button"
                                id="togglePassword"
                                class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-orange-600 transition"
                            >
                                <i
                                    id="togglePasswordIcon"
                                    class="fa-solid fa-eye text-sm"
                                ></i>
                            </button>

                        </div>
                    </div>


                    <!-- BUTTON -->
                    <button
                        id="loginButton"
                        type="submit"
                        class="w-full bg-orange-500 hover:bg-orange-600 active:bg-orange-700 text-white text-sm font-semibold py-2.5 rounded-lg transition flex items-center justify-center gap-2 shadow-md shadow-orange-500/20"
                    >

                        <span id="loginButtonText">
                            <i class="fa-solid fa-right-to-bracket mr-1.5"></i>
                            Masuk
                        </span>

                        <span
                            id="loginSpinner"
                            class="spinner hidden-force"
                        ></span>

                    </button>

                </form>


                <div class="mt-4 pt-3 border-t border-slate-100 text-center">

                    <p class="text-[11px] text-slate-400">
                        <i class="fa-solid fa-shield-halved mr-1"></i>
                        Akses sistem ChimChum Malang
                    </p>

                </div>

            </div>

        </div>

    </section>


    <script type="module" src="./js/module/login.js"></script>

</body>
</html>
