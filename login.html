<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ChimChum Malang - Login</title>

    <link
        rel="icon"
        type="image/jpeg"
        href="./assets/logo-transparan.png"
        onerror="this.src='https://placehold.co/50?text=CC'"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }

        .hidden-force {
            display: none !important;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.35);
            border-top-color: white;
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }

        .spinner-dark {
            width: 24px;
            height: 24px;
            border: 3px solid #e2e8f0;
            border-top-color: #f97316;
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body class="bg-slate-100 text-slate-800 min-h-screen">

    <!-- AUTH LOADING -->
    <div
        id="authLoading"
        class="fixed inset-0 z-[9999] bg-slate-100 flex items-center justify-center"
    >
        <div class="text-center">
            <div class="spinner-dark mx-auto mb-3"></div>

            <p class="text-sm font-medium text-slate-600">
                Memeriksa sesi...
            </p>
        </div>
    </div>


    <!-- LOGIN -->
    <section
        id="loginScreen"
        class="hidden-force min-h-screen flex items-center justify-center px-4 py-6"
    >

        <div class="w-full max-w-sm">

            <!-- BRAND -->
            <div class="text-center mb-5">

                <img
                    src="./assets/logo-transparan.png"
                    alt="ChimChum"
                    class="h-16 w-16 object-cover rounded-2xl mx-auto shadow-md"
                    onerror="this.src='https://placehold.co/80?text=CC'"
                >

                <h1 class="text-xl font-bold text-orange-600 mt-3">
                    ChimChum Malang
                </h1>

                <p class="text-xs text-slate-500 mt-0.5">
                    Management System
                </p>

            </div>


            <!-- LOGIN CARD -->
            <div class="bg-white rounded-2xl shadow-lg border border-slate-200 p-5">

                <div class="mb-4">
                    <h2 class="text-lg font-bold text-slate-800">
                        Masuk
                    </h2>

                    <p class="text-xs text-slate-500 mt-0.5">
                        Silakan masuk menggunakan akun Anda.
                    </p>
                </div>


                <!-- ERROR -->
                <div
                    id="loginError"
                    class="hidden mb-4 p-3 rounded-lg bg-red-50 border border-red-200 text-red-700 text-xs"
                >
                    <div class="flex items-start gap-2">
                        <i class="fa-solid fa-circle-exclamation mt-0.5"></i>

                        <span id="loginErrorText"></span>
                    </div>
                </div>


                <!-- FORM -->
                <form id="loginForm" class="space-y-3.5">

                    <!-- EMAIL -->
                    <div>

                        <label
                            for="loginEmail"
                            class="block text-xs font-semibold text-slate-700 mb-1.5"
                        >
                            Email / Username
                        </label>

                        <div class="relative">

                            <i
                                class="fa-solid fa-envelope absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"
                            ></i>

                            <input
                                id="loginEmail"
                                type="text"
                                autocomplete="email"
                                required
                                placeholder="nama@email.com / username"
                                class="w-full pl-10 pr-3 py-2.5 text-sm border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-orange-500 focus:border-orange-500 transition"
                            >

                        </div>
                    </div>


                    <!-- PASSWORD -->
                    <div>

                        <div class="flex justify-between items-center mb-1.5">
                            <label
                                for="loginPassword"
                                class="block text-xs font-semibold text-slate-700"
                            >
                                Password
                            </label>

                            <!-- TOMBOL LUPA PASSWORD -->
                            <button
                                type="button"
                                id="openResetModal"
                                class="text-xs text-orange-600 hover:text-orange-700 font-medium transition"
                            >
                                Lupa password?
                            </button>
                        </div>

                        <div class="relative">

                            <i
                                class="fa-solid fa-key absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"
                            ></i>

                            <input
                                id="loginPassword"
                                type="password"
                                autocomplete="current-password"
                                required
                                placeholder="Masukkan password"
                                class="w-full pl-10 pr-10 py-2.5 text-sm border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-orange-500 focus:border-orange-500 transition"
                            >

                            <button
                                type="button"
                                id="togglePassword"
                                class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-orange-600 transition"
                            >
                                <i
                                    id="togglePasswordIcon"
                                    class="fa-solid fa-eye text-sm"
                                ></i>
                            </button>

                        </div>
                    </div>


                    <!-- BUTTON -->
                    <button
                        id="loginButton"
                        type="submit"
                        class="w-full bg-orange-500 hover:bg-orange-600 active:bg-orange-700 text-white text-sm font-semibold py-2.5 rounded-lg transition flex items-center justify-center gap-2 shadow-md shadow-orange-500/20"
                    >

                        <span id="loginButtonText">
                            <i class="fa-solid fa-right-to-bracket mr-1.5"></i>
                            Masuk
                        </span>

                        <span
                            id="loginSpinner"
                            class="spinner hidden-force"
                        ></span>

                    </button>

                </form>


                <div class="mt-4 pt-3 border-t border-slate-100 text-center">

                    <p class="text-[11px] text-slate-400">
                        <i class="fa-solid fa-shield-halved mr-1"></i>
                        Akses sistem ChimChum Malang
                    </p>

                </div>

            </div>

        </div>

    </section>


    <!-- =====================================================
         MODAL RESET PASSWORD
    ====================================================== -->
    <div
        id="resetModal"
        class="hidden fixed inset-0 z-[10000] bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4"
    >
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-5 border border-slate-200">
            
            <div class="flex justify-between items-center mb-3">
                <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2">
                    <i class="fa-solid fa-rotate-right text-orange-500"></i>
                    Reset Password Akun
                </h3>
                <button type="button" id="closeResetModal" class="text-slate-400 hover:text-slate-600">
                    <i class="fa-solid fa-xmark text-sm"></i>
                </button>
            </div>

            <p class="text-xs text-slate-500 mb-4">
                Masukkan email yang terdaftar untuk memperbarui sandi pada Supabase Auth dan tabel user.
            </p>

            <!-- NOTIF DI MODAL -->
            <div id="resetAlert" class="hidden mb-3 p-2.5 rounded-lg text-xs"></div>

            <form id="resetForm" class="space-y-3">
                <div>
                    <label class="block text-[11px] font-medium text-slate-600 mb-1">Email Terdaftar</label>
                    <input
                        type="email"
                        id="resetEmail"
                        required
                        placeholder="nama@email.com"
                        class="w-full px-3 py-2 text-xs border border-slate-300 rounded-lg outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-100"
                    >
                </div>

                <div>
                    <label class="block text-[11px] font-medium text-slate-600 mb-1">Password Baru</label>
                    <input
                        type="password"
                        id="resetNewPassword"
                        required
                        minlength="6"
                        placeholder="Minimal 6 karakter"
                        class="w-full px-3 py-2 text-xs border border-slate-300 rounded-lg outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-100"
                    >
                </div>

                <div class="flex gap-2 pt-2">
                    <button
                        type="button"
                        id="cancelResetBtn"
                        class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-semibold py-2 rounded-lg transition"
                    >
                        Batal
                    </button>

                    <button
                        type="submit"
                        id="submitResetBtn"
                        class="flex-1 bg-orange-500 hover:bg-orange-600 text-white text-xs font-semibold py-2 rounded-lg transition shadow-sm"
                    >
                        Reset Sekarang
                    </button>
                </div>
            </form>

        </div>
    </div>


    <script type="module" src="./js/module/login.js"></script>
    <script type="module" src="./js/module/reset-password.js"></script>

</body>
</html>
