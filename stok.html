<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Stok - ChimChum</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f8fafc; }
        
        /* Animasi untuk notifikasi (toast) */
        @keyframes slideInDown {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .toast-enter { animation: slideInDown 0.3s ease-out forwards; }
    </style>
</head>
<body class="p-4 sm:p-6 overflow-y-auto text-slate-800">

<div class="max-w-6xl mx-auto space-y-6">

    <!-- Global Notification Box (Hidden by default) -->
    <div id="statusBox" class="hidden rounded-xl px-4 py-3 text-xs shadow-sm border toast-enter flex items-center justify-between">
        <div id="statusMessage" class="flex items-center gap-2"></div>
        <button onclick="hideStatus()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <!-- Header Section -->
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex flex-col md:flex-row md:justify-between md:items-center gap-4">
        <div>
            <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2">
                <i class="fa-solid fa-warehouse text-orange-500"></i> Monitoring & Update Stok
            </h2>
            <p class="text-xs text-slate-500 mt-1">Pantau ketersediaan stok produk secara real-time.</p>
        </div>
        <div id="connectionStatus" class="text-[10px] text-amber-600 bg-amber-50 px-3 py-1.5 rounded-lg border border-amber-200">
            <i class="fa-solid fa-circle-notch fa-spin mr-1"></i> Menghubungkan...
        </div>
    </div>

    <!-- Summary Cards -->
    <div id="stokSummary" class="grid grid-cols-2 lg:grid-cols-4 gap-4">
        <!-- Injected via JS -->
    </div>

    <!-- Table Controls (Search & Category Filter) -->
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
        
        <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-4 mb-5">
            <div>
                <h4 class="font-bold text-sm text-slate-800">Detail Stok</h4>
                <p id="tableInfo" class="text-[10px] text-slate-400 mt-0.5">Memuat data...</p>
            </div>
            
            <div class="flex flex-col sm:flex-row items-center gap-3 w-full sm:w-auto">
                <!-- Dropdown Kategori -->
                <div class="relative w-full sm:w-48">
                    <i class="fa-solid fa-tags absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                    <select id="kategoriFilter" onchange="filterData()" class="appearance-none bg-slate-50 border border-slate-200 rounded-xl pl-9 pr-8 py-2 text-xs outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-100 w-full transition cursor-pointer text-slate-600 font-medium">
                        <option value="all">Semua Kategori</option>
                        <!-- Injected via JS -->
                    </select>
                    <i class="fa-solid fa-chevron-down absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 text-[10px] pointer-events-none"></i>
                </div>

                <!-- Search Input -->
                <div class="relative w-full sm:w-64">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                    <input type="text" id="stokSearch" placeholder="Cari nama produk..." class="bg-slate-50 border border-slate-200 rounded-xl pl-9 pr-4 py-2 text-xs outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-100 w-full transition" oninput="filterData()">
                </div>
            </div>
        </div>

        <!-- Table -->
        <div class="overflow-x-auto border border-slate-100 rounded-xl">
            <table class="w-full text-left border-collapse text-xs">
                <thead>
                    <tr class="bg-slate-50 text-slate-600 font-semibold border-b border-slate-100">
                        <th class="p-3.5 min-w-[70px]">Foto</th>
                        <th class="p-3.5 min-w-[180px]">Nama Produk</th>
                        <th class="p-3.5 min-w-[110px]">Kategori</th>
                        <th class="p-3.5 min-w-[90px] text-center">Stok Sistem</th>
                        <th class="p-3.5 min-w-[90px] text-center">Status</th>
                        <th class="p-3.5 min-w-[130px] text-center">Update Cepat</th>
                    </tr>
                </thead>
                <tbody id="stokTableBody" class="divide-y divide-slate-100">
                    <tr><td colspan="6" class="text-center py-12 text-slate-400"><i class="fa-solid fa-circle-notch fa-spin text-orange-500 mr-2"></i>Memuat stok...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mt-5 pt-4 border-t border-slate-100">
            <div id="paginationInfoText" class="text-[11px] text-slate-500">
                Menampilkan 0 produk
            </div>
            
            <div class="flex items-center gap-1">
                <button id="btnPrevPage" onclick="changePage('prev')" class="px-3 py-1.5 rounded-lg border border-slate-200 text-slate-500 hover:bg-slate-50 text-xs font-medium disabled:opacity-50 transition" disabled>
                    <i class="fa-solid fa-chevron-left mr-1"></i> Prev
                </button>
                
                <div id="pageNumbers" class="flex gap-1 hidden sm:flex">
                    <!-- Injected via JS -->
                </div>
                <div id="pageInfoMobile" class="sm:hidden text-xs text-slate-600 font-medium px-2">Page 1</div>

                <button id="btnNextPage" onclick="changePage('next')" class="px-3 py-1.5 rounded-lg border border-slate-200 text-slate-500 hover:bg-slate-50 text-xs font-medium transition disabled:opacity-50" disabled>
                    Next <i class="fa-solid fa-chevron-right ml-1"></i>
                </button>
            </div>
        </div>

    </div>
</div>

<script>
    // =========================================================
    // MOCK SUPABASE & AUTH SETUP (For Preview Compatibility)
    // =========================================================
    // Di environment produksi Anda, ini akan diambil dari module.
    // Di sini kita membuat mock agar preview berjalan lancar.
    let supabaseConnected = false; 

    // Dummy Data jika gagal terkoneksi
    const dummyProducts = [
        { id: '1', nama: 'Dimsum Ayam', kategori: 'Makanan', stok: 45, foto: 'https://placehold.co/80?text=Dimsum' },
        { id: '2', nama: 'Dimsum Udang', kategori: 'Makanan', stok: 5, foto: 'https://placehold.co/80?text=Udang' },
        { id: '3', nama: 'Es Teh Manis', kategori: 'Minuman', stok: 0, foto: 'https://placehold.co/80?text=Teh' },
        { id: '4', nama: 'Lumpia Goreng', kategori: 'Makanan', stok: 12, foto: 'https://placehold.co/80?text=Lumpia' },
        { id: '5', nama: 'Es Jeruk', kategori: 'Minuman', stok: 8, foto: 'https://placehold.co/80?text=Jeruk' },
        { id: '6', nama: 'Pangsit Kuah', kategori: 'Makanan', stok: 20, foto: 'https://placehold.co/80?text=Pangsit' },
        { id: '7', nama: 'Kopi Susu', kategori: 'Minuman', stok: 0, foto: 'https://placehold.co/80?text=Kopi' },
    ];

    // =========================================================
    // STATE
    // =========================================================
    let products = [];
    let filteredProducts = [];
    let filterStatus = 'all'; // all, aman, menipis, habis
    
    // State Pagination
    let currentPage = 1;
    const itemsPerPage = 5; // Sesuai permintaan

    // =========================================================
    // HELPER: NOTIFICATION (Pengganti alert)
    // =========================================================
    function showStatus(message, type = 'error') {
        const box = document.getElementById('statusBox');
        const msgContainer = document.getElementById('statusMessage');
        
        box.classList.remove('hidden', 'bg-red-50', 'border-red-200', 'text-red-700', 'bg-emerald-50', 'border-emerald-200', 'text-emerald-700', 'bg-amber-50', 'border-amber-200', 'text-amber-700');
        
        let icon = '';
        if (type === 'error') {
            box.classList.add('bg-red-50', 'border-red-200', 'text-red-700');
            icon = '<i class="fa-solid fa-circle-exclamation text-red-500 text-sm"></i>';
        } else if (type === 'success') {
            box.classList.add('bg-emerald-50', 'border-emerald-200', 'text-emerald-700');
            icon = '<i class="fa-solid fa-circle-check text-emerald-500 text-sm"></i>';
        } else {
            box.classList.add('bg-amber-50', 'border-amber-200', 'text-amber-700');
            icon = '<i class="fa-solid fa-triangle-exclamation text-amber-500 text-sm"></i>';
        }

        msgContainer.innerHTML = `${icon} <span class="font-medium">${message}</span>`;
        box.classList.remove('hidden');

        // Auto hide after 4 seconds
        setTimeout(hideStatus, 4000);
    }

    function hideStatus() {
        document.getElementById('statusBox').classList.add('hidden');
    }

    // =========================================================
    // INITIALIZATION & DATA FETCHING
    // =========================================================
    async function loadStok() {
        try {
            // Simulasi fetch dari Supabase. 
            // Pada file js asli, ganti throw dengan `const { data } = await supabase...`
            if(!supabaseConnected) throw new Error("Gagal terkoneksi ke Database Supabase");
            
            // Misal berhasil:
            // products = data;
        } catch (error) {
            console.warn("Menggunakan Local/Dummy data:", error.message);
            products = [...dummyProducts]; // Fallback to dummy data
            document.getElementById('connectionStatus').innerHTML = '<i class="fa-solid fa-hard-drive mr-1"></i> Mode Offline (Data Mock)';
            document.getElementById('connectionStatus').classList.replace('text-amber-600', 'text-slate-500');
            document.getElementById('connectionStatus').classList.replace('bg-amber-50', 'bg-slate-100');
            document.getElementById('connectionStatus').classList.replace('border-amber-200', 'border-slate-200');
        }

        extractCategories();
        filterData(); // Ini akan memanggil renderSummary & renderTable
    }

    // =========================================================
    // EXTRACT & RENDER CATEGORIES
    // =========================================================
    function extractCategories() {
        const select = document.getElementById('kategoriFilter');
        const categories = new Set();
        
        products.forEach(p => {
            const cat = (p.kategori || p.category || '').trim();
            if (cat) categories.add(cat);
        });

        // Simpan opsi "Semua Kategori"
        select.innerHTML = '<option value="all">Semua Kategori</option>';
        
        Array.from(categories).sort().forEach(cat => {
            select.innerHTML += `<option value="${cat}">${cat}</option>`;
        });
    }

    // =========================================================
    // FILTERING LOGIC
    // =========================================================
    function setStatusFilter(status) {
        filterStatus = status;
        currentPage = 1; // Reset page on filter change
        filterData();
    }

    function filterData() {
        const searchKw = document.getElementById('stokSearch').value.toLowerCase().trim();
        const selectedCat = document.getElementById('kategoriFilter').value;

        // Reset filtered array
        filteredProducts = products.filter(p => {
            const matchName = (p.nama || p.name || '').toLowerCase().includes(searchKw);
            const matchCat = selectedCat === 'all' || (p.kategori || p.category) === selectedCat;
            
            let matchStatus = true;
            const st = Number(p.stok) || 0;
            if (filterStatus === 'habis') matchStatus = st <= 0;
            if (filterStatus === 'menipis') matchStatus = st > 0 && st <= 10;
            if (filterStatus === 'aman') matchStatus = st > 10;

            return matchName && matchCat && matchStatus;
        });

        renderSummary(); // Render summary based on TOTAL data (ignoring filters for overview)
        
        // Ensure current page is valid after filtering
        const totalPages = Math.ceil(filteredProducts.length / itemsPerPage) || 1;
        if (currentPage > totalPages) currentPage = totalPages;

        renderTable();
    }

    // =========================================================
    // RENDER SUMMARY CARDS
    // =========================================================
    function renderSummary() {
        // Kita hitung berdasarkan filter pencarian & kategori SAJA, 
        // tapi TIDAK difilter berdasarkan status (agar angkanya tetap valid).
        
        const searchKw = document.getElementById('stokSearch').value.toLowerCase().trim();
        const selectedCat = document.getElementById('kategoriFilter').value;

        const baseProducts = products.filter(p => {
             const matchName = (p.nama || p.name || '').toLowerCase().includes(searchKw);
             const matchCat = selectedCat === 'all' || (p.kategori || p.category) === selectedCat;
             return matchName && matchCat;
        });

        let total = baseProducts.length, aman = 0, menipis = 0, habis = 0;
        
        baseProducts.forEach(p => {
            const st = Number(p.stok) || 0;
            if (st <= 0) habis++;
            else if (st <= 10) menipis++;
            else aman++;
        });

        const activeClass = (target) => filterStatus === target ? 'ring-2 ring-orange-400 bg-white shadow-md' : 'bg-white hover:bg-slate-50 opacity-80 hover:opacity-100';

        document.getElementById('stokSummary').innerHTML = `
            <div onclick="setStatusFilter('all')" class="border border-slate-200 rounded-2xl p-4 cursor-pointer transition ${activeClass('all')}">
                <div class="flex justify-between items-start">
                    <div>
                        <div class="text-[11px] font-semibold text-slate-500 uppercase tracking-wide">Total Produk</div>
                        <div class="text-2xl font-bold text-slate-800 mt-1">${total}</div>
                    </div>
                    <div class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-500"><i class="fa-solid fa-boxes-stacked text-xs"></i></div>
                </div>
            </div>

            <div onclick="setStatusFilter('aman')" class="border border-emerald-200 rounded-2xl p-4 cursor-pointer transition ${activeClass('aman')}">
                <div class="flex justify-between items-start">
                    <div>
                        <div class="text-[11px] font-semibold text-emerald-600/80 uppercase tracking-wide">Stok Aman</div>
                        <div class="text-2xl font-bold text-emerald-600 mt-1">${aman}</div>
                        <div class="text-[9px] text-emerald-600/60 font-medium mt-1">Lebih dari 10 porsi</div>
                    </div>
                    <div class="w-8 h-8 rounded-full bg-emerald-100 flex items-center justify-center text-emerald-500"><i class="fa-solid fa-check text-xs"></i></div>
                </div>
            </div>

            <div onclick="setStatusFilter('menipis')" class="border border-amber-200 rounded-2xl p-4 cursor-pointer transition ${activeClass('menipis')}">
                <div class="flex justify-between items-start">
                    <div>
                        <div class="text-[11px] font-semibold text-amber-600/80 uppercase tracking-wide">Menipis</div>
                        <div class="text-2xl font-bold text-amber-600 mt-1">${menipis}</div>
                        <div class="text-[9px] text-amber-600/60 font-medium mt-1">1 - 10 porsi</div>
                    </div>
                    <div class="w-8 h-8 rounded-full bg-amber-100 flex items-center justify-center text-amber-500"><i class="fa-solid fa-triangle-exclamation text-xs"></i></div>
                </div>
            </div>

            <div onclick="setStatusFilter('habis')" class="border border-rose-200 rounded-2xl p-4 cursor-pointer transition ${activeClass('habis')}">
                <div class="flex justify-between items-start">
                    <div>
                        <div class="text-[11px] font-semibold text-rose-600/80 uppercase tracking-wide">Stok Habis</div>
                        <div class="text-2xl font-bold text-rose-600 mt-1">${habis}</div>
                        <div class="text-[9px] text-rose-600/60 font-medium mt-1">0 porsi (Kosong)</div>
                    </div>
                    <div class="w-8 h-8 rounded-full bg-rose-100 flex items-center justify-center text-rose-500"><i class="fa-solid fa-xmark text-xs"></i></div>
                </div>
            </div>
        `;
    }

    // =========================================================
    // PAGINATION LOGIC
    // =========================================================
    function changePage(direction) {
        const totalPages = Math.ceil(filteredProducts.length / itemsPerPage);
        
        if (direction === 'prev' && currentPage > 1) {
            currentPage--;
            renderTable();
        } else if (direction === 'next' && currentPage < totalPages) {
            currentPage++;
            renderTable();
        }
    }

    function goToPage(page) {
        currentPage = page;
        renderTable();
    }

    // =========================================================
    // RENDER MAIN TABLE
    // =========================================================
    function renderTable() {
        const tbody = document.getElementById('stokTableBody');
        const totalItems = filteredProducts.length;
        const totalPages = Math.ceil(totalItems / itemsPerPage) || 1;

        // Render Pagination Info
        const startIdx = totalItems === 0 ? 0 : ((currentPage - 1) * itemsPerPage) + 1;
        const endIdx = Math.min(currentPage * itemsPerPage, totalItems);
        
        document.getElementById('tableInfo').textContent = `${totalItems} produk ditemukan`;
        document.getElementById('paginationInfoText').innerHTML = `Menampilkan <span class="font-medium text-slate-700">${startIdx}</span> - <span class="font-medium text-slate-700">${endIdx}</span> dari <span class="font-medium text-slate-700">${totalItems}</span> produk`;
        document.getElementById('pageInfoMobile').textContent = `Page ${currentPage} of ${totalPages}`;

        document.getElementById('btnPrevPage').disabled = currentPage === 1;
        document.getElementById('btnNextPage').disabled = currentPage === totalPages || totalItems === 0;

        // Render Page Numbers
        let buttonsHTML = '';
        let startP = Math.max(1, currentPage - 2);
        let endP = Math.min(totalPages, startP + 4);
        if (endP - startP < 4 && startP > 1) startP = Math.max(1, endP - 4);

        for (let i = startP; i <= endP; i++) {
            if (i === currentPage) {
                buttonsHTML += `<button class="w-8 h-8 rounded-lg bg-orange-500 text-white flex items-center justify-center text-xs font-medium shadow-sm">${i}</button>`;
            } else {
                buttonsHTML += `<button onclick="goToPage(${i})" class="w-8 h-8 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50 flex items-center justify-center text-xs font-medium transition">${i}</button>`;
            }
        }
        document.getElementById('pageNumbers').innerHTML = buttonsHTML;

        // Render Empty State
        if (totalItems === 0) {
            tbody.innerHTML = `<tr><td colspan="6" class="text-center py-16"><div class="flex flex-col items-center"><div class="w-12 h-12 rounded-full bg-slate-50 flex items-center justify-center mb-3"><i class="fa-solid fa-box-open text-slate-300 text-xl"></i></div><p class="text-xs font-semibold text-slate-500">Tidak ada produk ditemukan.</p></div></td></tr>`;
            return;
        }

        // Apply Slice for Pagination
        const paginatedData = filteredProducts.slice((currentPage - 1) * itemsPerPage, currentPage * itemsPerPage);

        // Render Rows
        tbody.innerHTML = paginatedData.map(p => {
            const st = Number(p.stok) || 0;
            
            let badge = `<span class="bg-emerald-50 border border-emerald-200 text-emerald-700 px-2.5 py-1 rounded-lg font-semibold text-[10px]"><i class="fa-solid fa-check mr-1"></i>Aman</span>`;
            if (st <= 0) badge = `<span class="bg-rose-50 border border-rose-200 text-rose-700 px-2.5 py-1 rounded-lg font-semibold text-[10px]"><i class="fa-solid fa-xmark mr-1"></i>Habis</span>`;
            else if (st <= 10) badge = `<span class="bg-amber-50 border border-amber-200 text-amber-700 px-2.5 py-1 rounded-lg font-semibold text-[10px]"><i class="fa-solid fa-triangle-exclamation mr-1"></i>Menipis</span>`;

            return `
                <tr class="hover:bg-slate-50 transition">
                    <td class="p-3">
                        <img src="${p.foto || p.image || 'https://placehold.co/80'}" class="w-10 h-10 object-cover rounded-xl shadow-sm border border-slate-100" onerror="this.src='https://placehold.co/80?text=Error'">
                    </td>
                    <td class="p-3 font-semibold text-slate-800">${escapeHtml(p.nama || p.name)}</td>
                    <td class="p-3"><span class="bg-slate-100 text-slate-600 px-2 py-1 rounded-md text-[10px] font-medium">${escapeHtml(p.kategori || p.category || '-')}</span></td>
                    <td class="p-3 text-center font-bold text-slate-700 text-base">${st}</td>
                    <td class="p-3 text-center">${badge}</td>
                    <td class="p-3">
                        <div class="flex items-center justify-center gap-1.5">
                            <button onclick="modStock('${p.id}', ${st - 1})" class="w-8 h-8 rounded-lg bg-white border border-slate-200 text-slate-500 hover:bg-slate-50 hover:text-red-500 transition font-bold shadow-sm" title="Kurangi 1">-</button>
                            <input type="number" value="${st}" id="stok-${p.id}" class="w-14 text-center text-sm font-semibold text-slate-700 bg-slate-50 border border-slate-200 rounded-lg p-1.5 outline-none focus:border-orange-400 focus:bg-white transition" onchange="inputStock('${p.id}')">
                            <button onclick="modStock('${p.id}', ${st + 1})" class="w-8 h-8 rounded-lg bg-white border border-slate-200 text-slate-500 hover:bg-slate-50 hover:text-emerald-500 transition font-bold shadow-sm" title="Tambah 1">+</button>
                        </div>
                    </td>
                </tr>
            `;
        }).join('');
    }

    // =========================================================
    // UPDATE STOCK LOGIC
    // =========================================================
    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>"']/g, function(m) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
        });
    }

    window.modStock = async function(id, val) {
        val = Math.max(0, Number(val) || 0);
        
        try {
            // Simulasi proses update ke DB
            if(supabaseConnected) {
               // await supabase.from('products').update({ stok: val }).eq('id', id);
            }

            // Update state local
            products = products.map(p => String(p.id) === String(id) ? { ...p, stok: val } : p);
            
            // Re-render
            filterData();
            showStatus('Stok berhasil diperbarui!', 'success');
            
        } catch(e) { 
            showStatus('Gagal update stok: ' + e.message, 'error'); 
        }
    };

    window.inputStock = async function(id) {
        const inputEl = document.getElementById(`stok-${id}`);
        if(inputEl) {
            const v = Number(inputEl.value);
            await modStock(id, v);
        }
    };

    // INIT
    window.onload = () => {
        loadStok();
    };
</script>


<script type="module">
    import { requireAuth } from './js/module/auth-guard.js';
    const auth = await requireAuth(['admin']);
    if (auth) {
        await import('./js/module/stok.js');
    }
</script>


</body>
</html>
