<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Stok - ChimChum</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f8fafc; }

        /* Animasi untuk notifikasi (toast) */
        @keyframes slideInDown {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .toast-enter { animation: slideInDown 0.3s ease-out forwards; }
    </style>
</head>
<body class="p-4 sm:p-6 overflow-y-auto text-slate-800">

<div class="max-w-6xl mx-auto space-y-6">

    <!-- Notifikasi global (dikendalikan stok.js) -->
    <div id="statusBox" class="hidden fixed top-6 right-6 z-50 gap-4 rounded-xl px-4 py-3 text-xs shadow-xl border flex items-center justify-between">
        <div id="statusMessage" class="flex items-center gap-2"></div>
        <button onclick="hideStatus()" class="text-slate-400 hover:text-slate-600" aria-label="Tutup"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <!-- Header -->
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex flex-col md:flex-row md:justify-between md:items-center gap-4">
        <div>
            <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2">
                <i class="fa-solid fa-warehouse text-orange-500"></i> Monitoring & Update Stok
            </h2>
            <p class="text-xs text-slate-500 mt-1">Pantau ketersediaan stok produk secara real-time.</p>
        </div>
        <div id="connectionStatus" class="text-[10px] text-amber-600 bg-amber-50 px-3 py-1.5 rounded-lg border border-amber-200">
            <i class="fa-solid fa-circle-notch fa-spin mr-1"></i> Menghubungkan...
        </div>
    </div>

    <!-- Kartu ringkasan (diisi stok.js) -->
    <div id="stokSummary" class="grid grid-cols-2 lg:grid-cols-4 gap-4"></div>

    <!-- Tabel + kontrol -->
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">

        <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-4 mb-5">
            <div>
                <h4 class="font-bold text-sm text-slate-800">Detail Stok</h4>
                <p id="tableInfo" class="text-[10px] text-slate-400 mt-0.5">Memuat data...</p>
            </div>

            <div class="flex flex-col sm:flex-row items-center gap-3 w-full sm:w-auto">
                <!-- Dropdown kategori (event dipasang oleh stok.js) -->
                <div class="relative w-full sm:w-48">
                    <i class="fa-solid fa-tags absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                    <select id="kategoriFilter" class="appearance-none bg-slate-50 border border-slate-200 rounded-xl pl-9 pr-8 py-2 text-xs outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-100 w-full transition cursor-pointer text-slate-600 font-medium">
                        <option value="all">Semua Kategori</option>
                    </select>
                    <i class="fa-solid fa-chevron-down absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 text-[10px] pointer-events-none"></i>
                </div>

                <!-- Pencarian (event dipasang oleh stok.js) -->
                <div class="relative w-full sm:w-64">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                    <input type="text" id="stokSearch" placeholder="Cari nama produk..." autocomplete="off" class="bg-slate-50 border border-slate-200 rounded-xl pl-9 pr-4 py-2 text-xs outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-100 w-full transition">
                </div>
            </div>
        </div>

        <div class="overflow-x-auto border border-slate-100 rounded-xl">
            <table class="w-full text-left border-collapse text-xs">
                <thead>
                    <tr class="bg-slate-50 text-slate-600 font-semibold border-b border-slate-100">
                        <th class="p-3.5 min-w-[70px]">Foto</th>
                        <th class="p-3.5 min-w-[180px]">Nama Produk</th>
                        <th class="p-3.5 min-w-[110px]">Kategori</th>
                        <th class="p-3.5 min-w-[90px] text-center">Stok Sistem</th>
                        <th class="p-3.5 min-w-[90px] text-center">Status</th>
                        <th class="p-3.5 min-w-[130px] text-center">Update Cepat</th>
                    </tr>
                </thead>
                <tbody id="stokTableBody" class="divide-y divide-slate-100">
                    <tr><td colspan="6" class="text-center py-12 text-slate-400"><i class="fa-solid fa-circle-notch fa-spin text-orange-500 mr-2"></i>Memuat stok...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination (diisi stok.js) -->
        <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mt-5 pt-4 border-t border-slate-100">
            <div id="paginationInfoText" class="text-[11px] text-slate-500">Menampilkan 0 produk</div>

            <div class="flex items-center gap-1">
                <button id="btnPrevPage" onclick="changePage('prev')" class="px-3 py-1.5 rounded-lg border border-slate-200 text-slate-500 hover:bg-slate-50 text-xs font-medium disabled:opacity-50 transition" disabled>
                    <i class="fa-solid fa-chevron-left mr-1"></i> Prev
                </button>

                <div id="pageNumbers" class="hidden sm:flex gap-1"></div>
                <div id="pageInfoMobile" class="sm:hidden text-xs text-slate-600 font-medium px-2">Page 1</div>

                <button id="btnNextPage" onclick="changePage('next')" class="px-3 py-1.5 rounded-lg border border-slate-200 text-slate-500 hover:bg-slate-50 text-xs font-medium transition disabled:opacity-50" disabled>
                    Next <i class="fa-solid fa-chevron-right ml-1"></i>
                </button>
            </div>
        </div>

    </div>
</div>

<!-- Satu-satunya script logika: js/module/stok.js -->
<script type="module">
    import { requireAuth } from './js/module/auth-guard.js';
    const auth = await requireAuth(['admin']);
    if (auth) {
        await import('./js/module/stok.js');
    }
</script>

</body>
</html>
