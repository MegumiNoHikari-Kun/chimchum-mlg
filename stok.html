<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Stok - ChimChum</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>body { font-family: 'Poppins', sans-serif; }</style>
</head>
<body class="bg-white p-6 overflow-y-auto">
    <div class="max-w-6xl mx-auto">
        <div class="flex justify-between items-center mb-6 flex-wrap gap-4 border-b pb-4">
            <div>
                <h2 class="text-xl font-bold text-slate-800"><i class="fa-solid fa-warehouse text-orange-500 mr-2"></i> Monitoring &amp; Update Stok</h2>
                <p class="text-xs text-slate-500">Pantau ketersediaan stok produk secara real-time.</p>
            </div>
            <input type="text" id="stokSearch" placeholder="Cari produk..." class="bg-slate-50 border rounded-xl px-4 py-2 text-xs outline-none" oninput="renderTable()">
        </div>

        <div id="stokSummary" class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6"></div>

        <div class="overflow-x-auto border border-slate-100 rounded-2xl shadow-sm">
            <table class="w-full text-left border-collapse text-xs">
                <thead>
                    <tr class="bg-orange-50 text-slate-700 font-semibold">
                        <th class="p-3.5">Foto</th>
                        <th class="p-3.5">Nama Produk</th>
                        <th class="p-3.5">Kategori</th>
                        <th class="p-3.5">Stok Saat Ini</th>
                        <th class="p-3.5">Status</th>
                        <th class="p-3.5">Update Stok Cepat</th>
                    </tr>
                </thead>
                <tbody id="stokTableBody" class="divide-y divide-slate-100">
                    <tr><td colspan="6" class="text-center py-10 text-slate-400">Memuat stok...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script type="module" src="./js/module/stok.js"></script>
</body>
</html>
