<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Keuangan - ChimChum</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
    <style>body { font-family: 'Poppins', sans-serif; }</style>
</head>
<body class="bg-white p-6 overflow-y-auto">
    <div class="max-w-6xl mx-auto">
        <div class="flex justify-between items-center mb-6 flex-wrap gap-4 border-b pb-4">
            <div>
                <h2 class="text-xl font-bold text-slate-800"><i class="fa-solid fa-chart-line text-orange-500 mr-2"></i> Laporan Omzet &amp; Keuangan</h2>
                <p class="text-xs text-slate-500">Analisis pemasukan, HPP, dan profit bersih.</p>
            </div>
            <div class="flex gap-2 items-center flex-wrap">
                <input type="date" id="tglMulai" class="bg-slate-50 border rounded-xl px-3 py-2 text-xs outline-none">
                <input type="date" id="tglAkhir" class="bg-slate-50 border rounded-xl px-3 py-2 text-xs outline-none">
                <button onclick="renderReport()" class="bg-orange-500 text-white px-4 py-2 rounded-xl text-xs font-semibold"><i class="fa-solid fa-filter mr-1"></i> Filter</button>
            </div>
        </div>

        <div id="summaryCards" class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6"></div>

        <div class="relative h-64 mb-6 bg-slate-50 border rounded-2xl p-4">
            <canvas id="reportChart"></canvas>
        </div>

        <div class="overflow-x-auto border border-slate-100 rounded-2xl shadow-sm">
            <table class="w-full text-left border-collapse text-xs">
                <thead>
                    <tr class="bg-orange-50 text-slate-700 font-semibold">
                        <th class="p-3.5">Tanggal</th>
                        <th class="p-3.5">Jumlah Transaksi</th>
                        <th class="p-3.5">Omzet</th>
                        <th class="p-3.5">Estimasi HPP</th>
                        <th class="p-3.5">Profit Bersih</th>
                    </tr>
                </thead>
                <tbody id="reportTable" class="divide-y divide-slate-100">
                    <tr><td colspan="5" class="text-center py-10 text-slate-400">Memuat laporan...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    <script type="module" src="./js/module/laporan.js"></script>
</body>
</html>
