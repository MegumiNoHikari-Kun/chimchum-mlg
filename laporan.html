<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Keuangan - ChimChum</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
    <style>
        body { font-family: 'Poppins', sans-serif; }
        .tabular { font-variant-numeric: tabular-nums; }
        .skeleton { background: linear-gradient(90deg,#f1f5f9 25%,#e2e8f0 37%,#f1f5f9 63%); background-size: 400% 100%; animation: sk 1.4s ease infinite; border-radius: .5rem; }
        @keyframes sk { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
        input[type="date"]::-webkit-calendar-picker-indicator { cursor: pointer; opacity: .6; }
    </style>
</head>
<body class="bg-slate-50 p-4 md:p-6 overflow-y-auto text-slate-700">
    <div class="max-w-6xl mx-auto space-y-5">

        <!-- Header -->
        <div class="flex flex-col lg:flex-row lg:items-end lg:justify-between gap-4">
            <div>
                <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2">
                    <span class="w-9 h-9 rounded-xl bg-orange-100 text-orange-500 grid place-items-center"><i class="fa-solid fa-chart-line"></i></span>
                    Laporan Omzet &amp; Keuangan
                </h2>
                <p class="text-xs text-slate-500 mt-1">Analisis pemasukan, HPP, dan profit bersih.</p>
            </div>
            <button id="btnExport" type="button" disabled
                class="self-start lg:self-auto inline-flex items-center gap-2 bg-white border border-slate-200 hover:border-orange-300 hover:text-orange-600 disabled:opacity-40 disabled:pointer-events-none px-4 py-2 rounded-xl text-xs font-semibold transition">
                <i class="fa-solid fa-file-arrow-down"></i> Export CSV
            </button>
        </div>

        <!-- Filter bar -->
        <div class="bg-white border border-slate-100 rounded-2xl p-3 md:p-4 shadow-sm flex flex-col md:flex-row md:items-center gap-3">
            <div id="presetGroup" class="flex gap-1.5 overflow-x-auto pb-1 md:pb-0 -mx-1 px-1">
                <button type="button" data-preset="today"     class="preset-btn">Hari ini</button>
                <button type="button" data-preset="7d"        class="preset-btn">7 hari</button>
                <button type="button" data-preset="30d"       class="preset-btn">30 hari</button>
                <button type="button" data-preset="month"     class="preset-btn">Bulan ini</button>
                <button type="button" data-preset="lastmonth" class="preset-btn">Bulan lalu</button>
            </div>
            <div class="flex items-center gap-2 md:ml-auto">
                <label class="sr-only" for="tglMulai">Tanggal mulai</label>
                <input type="date" id="tglMulai" class="flex-1 md:flex-none bg-slate-50 border border-slate-200 focus:border-orange-400 focus:ring-2 focus:ring-orange-100 rounded-xl px-3 py-2 text-xs outline-none transition">
                <span class="text-slate-400 text-xs">s/d</span>
                <label class="sr-only" for="tglAkhir">Tanggal akhir</label>
                <input type="date" id="tglAkhir" class="flex-1 md:flex-none bg-slate-50 border border-slate-200 focus:border-orange-400 focus:ring-2 focus:ring-orange-100 rounded-xl px-3 py-2 text-xs outline-none transition">
                <button id="btnFilter" type="button" onclick="renderReport()"
                    class="bg-orange-500 hover:bg-orange-600 active:scale-95 disabled:opacity-60 text-white px-4 py-2 rounded-xl text-xs font-semibold transition inline-flex items-center gap-1.5 whitespace-nowrap">
                    <i class="fa-solid fa-rotate-right"></i> <span>Muat</span>
                </button>
            </div>
        </div>

        <!-- Alerts -->
        <div id="alerts" class="space-y-2"></div>

        <!-- Summary cards -->
        <div id="summaryCards" class="grid grid-cols-2 lg:grid-cols-4 gap-3"></div>

        <!-- Chart -->
        <div class="bg-white border border-slate-100 rounded-2xl p-4 shadow-sm">
            <div class="flex items-center justify-between mb-3">
                <h3 class="text-sm font-semibold text-slate-800">Tren Harian</h3>
                <span id="chartRange" class="text-[11px] text-slate-400"></span>
            </div>
            <div class="relative h-64 md:h-72">
                <canvas id="reportChart"></canvas>
                <div id="chartEmpty" class="hidden absolute inset-0 grid place-items-center text-center text-slate-400 text-xs">
                    <div><i class="fa-regular fa-chart-bar text-3xl mb-2 block text-slate-300"></i>Belum ada data untuk ditampilkan.</div>
                </div>
            </div>
        </div>

        <!-- Table -->
        <div class="bg-white border border-slate-100 rounded-2xl shadow-sm overflow-hidden">
            <div class="flex items-center justify-between px-4 pt-4 pb-2">
                <h3 class="text-sm font-semibold text-slate-800">Rincian per Hari</h3>
                <span id="tableInfo" class="text-[11px] text-slate-400"></span>
            </div>
            <div class="overflow-x-auto max-h-[520px]">
                <table class="w-full min-w-[640px] text-left border-collapse text-xs tabular">
                    <thead class="sticky top-0 z-10">
                        <tr class="bg-orange-50 text-slate-600 font-semibold">
                            <th class="p-3.5">Tanggal</th>
                            <th class="p-3.5 text-right">Transaksi</th>
                            <th class="p-3.5 text-right">Omzet</th>
                            <th class="p-3.5 text-right">Estimasi HPP</th>
                            <th class="p-3.5 text-right">Profit Bersih</th>
                            <th class="p-3.5 text-right">Margin</th>
                        </tr>
                    </thead>
                    <tbody id="reportTable" class="divide-y divide-slate-100">
                        <tr><td colspan="6" class="text-center py-10 text-slate-400">Memuat laporan...</td></tr>
                    </tbody>
                    <tfoot id="reportFoot" class="sticky bottom-0"></tfoot>
                </table>
            </div>
        </div>
    </div>

    <style type="text/tailwindcss">
        .preset-btn { @apply whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-medium text-slate-600 bg-slate-100 hover:bg-orange-50 hover:text-orange-600 transition; }
        .preset-btn.active { @apply bg-orange-500 text-white hover:bg-orange-500 hover:text-white; }
    </style>

    <script type="module">
        import { requireAuth } from './js/module/auth-guard.js';

        const auth = await requireAuth(['admin']);

        if (auth) {
            await import('./js/module/laporan.js');
        }
    </script>
</body>
</html>
