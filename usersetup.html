<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kelola User - ChimChum</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }

        input,
        select,
        textarea,
        button {
            font-family: inherit;
        }

        .loading-spinner {
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body class="bg-white p-4 sm:p-6 overflow-y-auto">

<div class="max-w-6xl mx-auto">

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <div class="flex flex-col lg:flex-row lg:justify-between lg:items-center gap-4 mb-6 border-b pb-4">

        <div>

            <h3
                id="formTitle"
                class="font-bold text-base text-slate-800 flex items-center gap-2"
            >
                <i class="fa-solid fa-user-plus text-orange-500"></i>
                Tambah User
            </h3>

            <p class="text-xs text-slate-500 mt-1">
                Kelola hak akses akun & staff aplikasi kasir ChimChum.
            </p>

        </div>


        <div class="w-full lg:w-80">

            <div class="relative">

                <i
                    class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xs"
                ></i>

            </div>

        </div>

    </div>


    <!-- =====================================================
         STATUS
    ====================================================== -->

    <div
        id="statusBox"
        class="hidden mb-5 rounded-xl px-4 py-3 text-xs"
    ></div>


    <!-- =====================================================
         FORM USER
    ====================================================== -->

    <div class="bg-slate-50 border border-slate-100 rounded-2xl p-4 sm:p-5 mb-6 shadow-sm">

        <input
            type="hidden"
            id="u-id"
        >


        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 mb-3">

            <!-- USERNAME -->

            <div>

                <label class="block text-[11px] font-medium text-slate-600 mb-1">
                    Username/email
                    <span class="text-red-500">*</span>
                </label>

                <input
                    id="u-username"
                    type="text"
                    maxlength="50"
                    placeholder="Contoh: kasir_budi"
                    class="bg-white border border-slate-200 rounded-xl p-2.5 text-xs outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-100 w-full transition"
                >

            </div>


            <!-- PASSWORD -->

            <div>

                <label class="block text-[11px] font-medium text-slate-600 mb-1">
                    Password
                    <span id="password-required-star" class="text-red-500">*</span>
                </label>

                <div class="relative">

                    <input
                        id="u-password"
                        type="password"
                        maxlength="100"
                        placeholder="Minimal 6 karakter"
                        class="bg-white border border-slate-200 rounded-xl p-2.5 pr-10 text-xs outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-100 w-full transition"
                    >

                    <button
                        type="button"
                        id="btnTogglePassword"
                        class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 text-xs"
                    >
                        <i id="eyeIcon" class="fa-solid fa-eye"></i>
                    </button>

                </div>

                <p id="passwordHint" class="text-[10px] text-slate-400 mt-1 hidden">
                    Kosongkan jika tidak ingin mengganti password.
                </p>

            </div>


            <!-- ROLE -->

            <div>

                <label class="block text-[11px] font-medium text-slate-600 mb-1">
                    Role Akses
                    <span class="text-red-500">*</span>
                </label>

                <select
                    id="u-role"
                    class="bg-white border border-slate-200 rounded-xl p-2.5 text-xs outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-100 w-full transition cursor-pointer"
                >
                    <option value="staff">Staff</option>
                    <option value="kasir">Kasir</option>
                    <option value="admin">Admin</option>
                    <option value="owner">Owner</option>
                </select>

            </div>

        </div>


        <!-- BUTTON -->

        <div class="flex flex-wrap gap-2 mt-4">

            <button
                id="btnSave"
                type="button"
                class="bg-orange-500 hover:bg-orange-600 disabled:bg-orange-300 disabled:cursor-not-allowed text-white font-semibold px-5 py-2.5 rounded-xl text-xs transition shadow-sm"
            >

                <i class="fa-solid fa-save mr-1"></i>

                <span id="btnSaveText">
                    Simpan User
                </span>

            </button>


            <button
                id="btnCancelEdit"
                type="button"
                class="hidden bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold px-4 py-2.5 rounded-xl text-xs transition"
            >

                <i class="fa-solid fa-xmark mr-1"></i>

                Batal Edit

            </button>


            <button
                id="btnRefresh"
                type="button"
                class="bg-white border border-slate-200 hover:bg-slate-100 text-slate-600 font-semibold px-4 py-2.5 rounded-xl text-xs transition"
            >

                <i class="fa-solid fa-rotate mr-1"></i>

                Refresh

            </button>

        </div>

    </div>


    <!-- =====================================================
         TABLE HEADER
    ====================================================== -->

    <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-2 mb-3">

        <div>

            <h4 class="font-bold text-sm text-slate-800">
                Daftar User
            </h4>
            

            <p
                id="userCount"
                class="text-[10px] text-slate-400 mt-0.5"
            >
                Memuat...
            </p>

        </div>


        <div
            id="connectionStatus"
            class="text-[10px] text-slate-400"
        >

            <i class="fa-solid fa-circle-notch loading-spinner mr-1"></i>

            Menghubungkan...

        </div>

    </div>


    <!-- =====================================================
         TABLE
    ====================================================== -->

    <div class="overflow-x-auto border border-slate-100 rounded-2xl shadow-sm">
         <div class="relative w-full lg:w-80">
            <!-- Icon Kaca Pembesar -->
            <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
        
            <!-- Input Search -->
            <input
                type="text"
                id="u-search"
                placeholder="Cari username atau role..."
                autocomplete="off"
                class="bg-slate-50 border border-slate-200 rounded-xl pl-10 pr-9 py-2.5 text-xs outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-100 w-full transition"
            >
        
            <!-- Tombol Clear (X) yang otomatis muncul saat diketik -->
            <button
                type="button"
                id="btnClearSearch"
                class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 text-xs p-1"
                title="Bersihkan pencarian"
            >
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <table class="w-full text-left border-collapse text-xs">

            <thead>

                <tr class="bg-orange-50 text-slate-700 font-semibold">

                    <th class="p-3.5 min-w-[180px]">
                        Username
                    </th>

                    <th class="p-3.5 min-w-[120px]">
                        Role
                    </th>

                    <th class="p-3.5 min-w-[150px]">
                        Dibuat
                    </th>

                    <th class="p-3.5 min-w-[110px]">
                        Aksi
                    </th>

                </tr>

            </thead>


            <tbody
                id="userTable"
                class="divide-y divide-slate-100"
            >

                <tr>

                    <td
                        colspan="5"
                        class="text-center py-10 text-slate-400"
                    >

                        <i class="fa-solid fa-circle-notch loading-spinner text-orange-500 mr-2"></i>

                        Memuat user...

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>


<script type="module">

import {
    supabase,
    authReady
} from './js/supabase.js';


// =========================================================
// STATE
// =========================================================

let users = [];
let usingLocalStorage = false;
let isSaving = false;
let isDeleting = false;


// =========================================================
// DOM HELPER
// =========================================================

const $ = (id) => document.getElementById(id);


// =========================================================
// ESCAPE HTML
// =========================================================

function escapeHtml(value) {
    if (value === null || value === undefined) {
        return '';
    }
    return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}


// =========================================================
// FORMAT DATE
// =========================================================

function formatUserDate(iso) {
    try {
        const d = new Date(iso);
        return d.toLocaleString('id-ID', {
            day: '2-digit',
            month: 'short',
            year: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
        });
    } catch {
        return iso || '-';
    }
}


// =========================================================
// LOCAL STORAGE
// =========================================================

function saveLocalUsers() {
    try {
        localStorage.setItem(
            'local_usersetup',
            JSON.stringify(users)
        );
    } catch (error) {
        console.warn('LocalStorage gagal:', error);
    }
}


// =========================================================
// STATUS MESSAGE
// =========================================================

function showStatus(message, type = 'success') {
    const box = $('statusBox');
    if (!box) return;

    box.className = 'mb-5 rounded-xl px-4 py-3 text-xs border';

    if (type === 'success') {
        box.classList.add('bg-emerald-50', 'text-emerald-700', 'border-emerald-200');
        box.innerHTML = '<i class="fa-solid fa-circle-check mr-2"></i>' + escapeHtml(message);
    } else if (type === 'warning') {
        box.classList.add('bg-amber-50', 'text-amber-700', 'border-amber-200');
        box.innerHTML = '<i class="fa-solid fa-triangle-exclamation mr-2"></i>' + escapeHtml(message);
    } else {
        box.classList.add('bg-red-50', 'text-red-700', 'border-red-200');
        box.innerHTML = '<i class="fa-solid fa-circle-exclamation mr-2"></i>' + escapeHtml(message);
    }
}

function hideStatus() {
    $('statusBox')?.classList.add('hidden');
}


// =========================================================
// CONNECTION STATUS
// =========================================================

function setConnectionStatus(connected, localMode = false) {
    const element = $('connectionStatus');
    if (!element) return;

    if (localMode) {
        element.className = 'text-[10px] text-amber-600';
        element.innerHTML = '<i class="fa-solid fa-hard-drive mr-1"></i>Mode Local Storage';
        return;
    }

    if (connected) {
        element.className = 'text-[10px] text-emerald-600';
        element.innerHTML = '<i class="fa-solid fa-circle-check mr-1"></i>Terhubung ke Supabase';
    } else {
        element.className = 'text-[10px] text-red-600';
        element.innerHTML = '<i class="fa-solid fa-circle-xmark mr-1"></i>Supabase tidak terhubung';
    }
}


// =========================================================
// LOAD USERS
// =========================================================

async function loadUsers() {
    const tbody = $('userTable');
    if (tbody) {
        tbody.innerHTML = `
            <tr>
                <td colspan="5" class="text-center py-10 text-slate-400">
                    <i class="fa-solid fa-circle-notch loading-spinner text-orange-500 mr-2"></i>
                    Memuat user...
                </td>
            </tr>
        `;
    }

    try {
        await authReady;

        const { data, error } = await supabase
            .from('usersetup')
            .select('*')
            .order('created_at', { ascending: false });

        if (error) {
            throw error;
        }

        users = Array.isArray(data) ? data : [];
        usingLocalStorage = false;
        setConnectionStatus(true, false);
        saveLocalUsers();
        renderTable(users);

        console.log('USERS LOADED:', users);
    } catch (error) {
        console.error('Supabase load error:', error);

        let localData = [];
        try {
            const stored = localStorage.getItem('local_usersetup');
            localData = stored ? JSON.parse(stored) : [];
        } catch {
            localData = [];
        }

        users = Array.isArray(localData) && localData.length > 0 ? localData : [
            { id: 'usr_1', username: 'admin', role: 'admin', created_at: new Date().toISOString() },
            { id: 'usr_2', username: 'kasir1', role: 'kasir', created_at: new Date().toISOString() }
        ];

        usingLocalStorage = true;
        setConnectionStatus(false, true);
        renderTable(users);

        showStatus(
            'Supabase gagal mengambil data. Mode Local Storage digunakan. ' + getErrorMessage(error),
            'warning'
        );
    }
}


// =========================================================
// RENDER TABLE
// =========================================================

function renderTable(dataList) {
    const tbody = $('userTable');
    if (!tbody) return;

    const list = Array.isArray(dataList) ? dataList : [];
    $('userCount').textContent = `${list.length} user ditampilkan`;

    if (list.length === 0) {
        tbody.innerHTML = `
            <tr>
                <td colspan="5" class="text-center py-12">
                    <div class="flex flex-col items-center">
                        <div class="w-12 h-12 rounded-full bg-slate-100 flex items-center justify-center mb-3">
                            <i class="fa-solid fa-users-slash text-slate-400"></i>
                        </div>
                        <p class="text-xs font-semibold text-slate-500">
                            Tidak ada user ditemukan
                        </p>
                        <p class="text-[10px] text-slate-400 mt-1">
                            Tambahkan user baru menggunakan form di atas.
                        </p>
                    </div>
                </td>
            </tr>
        `;
        return;
    }

    const roleColors = {
        admin: 'bg-rose-50 text-rose-700 border-rose-200',
        owner: 'bg-violet-50 text-violet-700 border-violet-200',
        kasir: 'bg-amber-50 text-amber-700 border-amber-200',
        staff: 'bg-emerald-50 text-emerald-700 border-emerald-200'
    };

    tbody.innerHTML = list.map(u => {
        // const id = u?.id ?? '';
        const username = u?.username ?? '-';
        const role = u?.role ?? 'staff';
        const roleClass = roleColors[role] || 'bg-slate-100 text-slate-600 border-slate-200';
        const createdDisplay = u?.created_at ? formatUserDate(u.created_at) : '-';
        const shortId = String(id).length > 8 ? String(id).slice(0, 8) + '...' : String(id);

        return `
            <tr class="hover:bg-slate-50 transition">
                <td class="p-3 font-semibold text-slate-800">
                    ${escapeHtml(username)}
                </td>

                <td class="p-3">
                    <span class="inline-block px-2.5 py-0.5 rounded-full font-semibold text-[10px] border ${roleClass}">
                        ${escapeHtml(role)}
                    </span>
                </td>

                <td class="p-3 text-slate-500">
                    ${createdDisplay}
                </td>

                <td class="p-3">
                    <div class="flex gap-1">
                        <button
                            type="button"
                            data-action="edit"
                            data-id="${escapeHtml(id)}"
                            class="bg-sky-50 text-sky-600 hover:bg-sky-100 p-2 rounded-lg transition"
                            title="Edit"
                        >
                            <i class="fa-solid fa-pen"></i>
                        </button>

                        <button
                            type="button"
                            data-action="delete"
                            data-id="${escapeHtml(id)}"
                            class="bg-rose-50 text-rose-600 hover:bg-rose-100 p-2 rounded-lg transition"
                            title="Hapus"
                        >
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                </td>
            </tr>
        `;
    }).join('');
}


// =========================================================
// FILTER
// =========================================================

function filterTable() {
    const keyword = $('u-search').value.toLowerCase().trim();

    if (!keyword) {
        renderTable(users);
        return;
    }

    const filtered = users.filter(u => {
        const username = String(u?.username ?? '').toLowerCase();
        const role = String(u?.role ?? '').toLowerCase();
        return username.includes(keyword) || role.includes(keyword);
    });

    renderTable(filtered);
}


// =========================================================
// FORM DATA
// =========================================================

function getFormData() {
    const id = $('u-id').value.trim();
    const username = $('u-username').value.trim();
    const password = $('u-password').value;
    const role = $('u-role').value;
    const isEditing = !!id;

    if (!username) {
        throw new Error('Username wajib diisi.');
    }

    if (!isEditing && !password) {
        throw new Error('Password wajib diisi untuk user baru.');
    }

    if (password && password.length < 6) {
        throw new Error('Password minimal harus 6 karakter.');
    }

    // Cek duplikat username
    const duplicate = users.find(u =>
        String(u?.username || '').toLowerCase() === username.toLowerCase() &&
        String(u?.id || '') !== String(id || '')
    );

    if (duplicate) {
        throw new Error('Username sudah digunakan, silakan pilih username lain.');
    }

    const payload = { username, role };
    if (password) {
        payload.password = password;
    }

    return payload;
}


// =========================================================
// RESET FORM
// =========================================================

function resetForm() {
    $('u-id').value = '';$('u-username').value = '';
    $('u-password').value = '';$('u-password').required = true;
    $('u-role').value = 'staff';

    $('password-required-star').classList.remove('hidden');$('passwordHint').classList.add('hidden');

    $('btnCancelEdit').classList.add('hidden');$('formTitle').innerHTML = '<i class="fa-solid fa-user-plus text-orange-500"></i> Tambah User';
    $('btnSaveText').textContent = 'Simpan User';
}


// =========================================================
// EDIT USER
// =========================================================

function editUser(id) {
    const user = users.find(item => String(item?.id) === String(id));
    if (!user) {
        showStatus('User tidak ditemukan di data aplikasi.', 'error');
        return;
    }

    $('u-id').value = user.id ?? '';
    $('u-username').value = user.username ?? '';
    $('u-password').value = '';$('u-password').required = false;
    $('u-role').value = user.role || 'staff';

    $('password-required-star').classList.add('hidden');$('passwordHint').classList.remove('hidden');

    $('btnCancelEdit').classList.remove('hidden');$('formTitle').innerHTML = '<i class="fa-solid fa-user-pen text-sky-500"></i> Edit User';
    $('btnSaveText').textContent = 'Update User';

    window.scrollTo({ top: 0, behavior: 'smooth' });
    setTimeout(() => $('u-username').focus(), 200);
}


// =========================================================
// SAVE USER
// =========================================================

async function saveUser() {
    if (isSaving) return;
    isSaving = true;

    const button = $('btnSave');
    const buttonText = $('btnSaveText');

    button.disabled = true;
    buttonText.textContent = 'Menyimpan...';

    try {
        const id = $('u-id').value.trim();
        const payload = getFormData();
        const isEditing = !!id;

        if (usingLocalStorage) {
            if (isEditing) {
                const index = users.findIndex(item => String(item.id) === String(id));
                if (index === -1) throw new Error('User tidak ditemukan di Local Storage.');

                users[index] = { ...users[index], ...payload };
                showStatus('User berhasil diperbarui di Local Storage.', 'success');
            } else {
                users.unshift({
                    id: 'usr_' + Date.now(),
                    ...payload,
                    created_at: new Date().toISOString()
                });
                showStatus('User berhasil ditambahkan ke Local Storage.', 'success');
            }

            saveLocalUsers();
            renderTable(users);
            resetForm();
            return;
        }

        // =====================================================
        // SUPABASE ACTIONS
        // =====================================================
        if (isEditing) {
            const { data: updatedRows, error: updateError } = await supabase
                .from('usersetup')
                .update(payload)
                .eq('id', id)
                .select('*');

            if (updateError) throw updateError;
            if (!Array.isArray(updatedRows) || updatedRows.length === 0) {
                throw new Error('UPDATE gagal. ID tidak ditemukan atau RLS menolak akses.');
            }

            showStatus('User berhasil diperbarui di Supabase.', 'success');
        } else {
            const { data: insertedRows, error: insertError } = await supabase
                .from('usersetup')
                .insert([payload])
                .select('*');

            if (insertError) throw insertError;
            if (!Array.isArray(insertedRows) || insertedRows.length === 0) {
                throw new Error('INSERT gagal menghasilkan row baru.');
            }

            showStatus('User baru berhasil disimpan di Supabase.', 'success');
        }

        resetForm();
        await loadUsers();
    } catch (error) {
        console.error('SAVE USER ERROR:', error);
        showStatus(getErrorMessage(error), 'error');
    } finally {
        isSaving = false;
        button.disabled = false;
        buttonText.textContent = $('u-id').value.trim() ? 'Update User' : 'Simpan User';
    }
}


// =========================================================
// DELETE USER
// =========================================================

async function deleteUser(id) {
    if (isDeleting) return;

    const user = users.find(item => String(item?.id) === String(id));
    const username = user ? user.username : 'user ini';

    const confirmed = confirm(`Hapus user "${username}"?\n\nTindakan ini tidak dapat dibatalkan.`);
    if (!confirmed) return;

    isDeleting = true;

    try {
        if (usingLocalStorage) {
            users = users.filter(item => String(item.id) !== String(id));
            saveLocalUsers();
            renderTable(users);
            showStatus('User berhasil dihapus dari Local Storage.', 'success');
            return;
        }

        const { data: deletedRows, error: deleteError } = await supabase
            .from('usersetup')
            .delete()
            .eq('id', id)
            .select('*');

        if (deleteError) throw deleteError;
        if (!Array.isArray(deletedRows) || deletedRows.length === 0) {
            throw new Error('DELETE gagal. ID tidak ditemukan atau ditolak RLS.');
        }

        showStatus('User berhasil dihapus dari Supabase.', 'success');
        await loadUsers();
    } catch (error) {
        console.error('DELETE USER ERROR:', error);
        showStatus(getErrorMessage(error), 'error');
    } finally {
        isDeleting = false;
    }
}


// =========================================================
// ERROR FORMATTER
// =========================================================

function getErrorMessage(error) {
    if (!error) return 'Unknown error';
    return error.message || error.error_description || error.details || error.hint || String(error);
}


// =========================================================
// EVENTS & TOGGLE PASSWORD
// =========================================================

$('btnTogglePassword').addEventListener('click', () => {
    const input = $('u-password');
    const eye = $('eyeIcon');
    if (input.type === 'password') {
        input.type = 'text';
        eye.className = 'fa-solid fa-eye-slash';
    } else {
        input.type = 'password';
        eye.className = 'fa-solid fa-eye';
    }
});

$('btnSave').addEventListener('click', saveUser);
$('btnCancelEdit').addEventListener('click', resetForm);$('btnRefresh').addEventListener('click', async () => {
    hideStatus();
    await loadUsers();
});

$('u-search').addEventListener('input', filterTable);

$('userTable').addEventListener('click', event => {
    const button = event.target.closest('button[data-action]');
    if (!button) return;

    const action = button.dataset.action;
    const id = button.dataset.id;

    if (!id) {
        showStatus('ID user kosong.', 'error');
        return;
    }

    if (action === 'edit') editUser(id);
    if (action === 'delete') deleteUser(id);
});


// =========================================================
// INITIALIZE
// =========================================================

(async function init() {
    try {
        await authReady;
        await loadUsers();
    } catch (error) {
        console.error('INITIALIZATION ERROR:', error);
        showStatus(getErrorMessage(error), 'error');
    }
})();

</script>
