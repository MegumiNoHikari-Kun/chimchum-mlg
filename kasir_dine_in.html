<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir Dine-In - ChimChum</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>body { font-family: 'Poppins', sans-serif; }</style>
</head>
<body class="bg-white p-6 overflow-y-auto">
    <div class="max-w-6xl mx-auto">
        <div class="flex gap-4 mb-6 flex-wrap bg-slate-50 p-4 rounded-2xl border border-slate-100 items-center">
            <div class="flex-1 min-w-[240px]">
                <input type="text" id="searchMenu" placeholder="🔍 Cari nama menu atau produk..." class="w-full bg-white border border-slate-200 rounded-xl px-4 py-2.5 text-xs outline-none focus:border-orange-500" oninput="filterMenu()">
            </div>
            <div class="w-48">
                <select id="filterKat" class="w-full bg-white border border-slate-200 rounded-xl px-4 py-2.5 text-xs outline-none focus:border-orange-500 cursor-pointer" onchange="filterMenu()">
                    <option value="Semua">All Kategori</option>
                </select>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2">
                <div id="menuList" class="grid grid-cols-2 sm:grid-cols-3 gap-3"></div>
            </div>

            <div class="bg-slate-50 border border-slate-100 rounded-2xl p-5 h-fit sticky top-4 shadow-sm">
                <h3 class="font-bold text-sm text-slate-800 mb-3 flex items-center gap-2"><i class="fa-solid fa-file-invoice-dollar text-orange-500"></i> Struk Kasir Dine-In</h3>
                
                <div id="cartItems" class="max-h-60 overflow-y-auto border-t border-dashed border-slate-200 py-3 space-y-3">
                    <p class="text-center text-xs text-slate-400 py-6">Belum ada item dipilih.</p>
                </div>

                <div class="border-t border-slate-200 pt-3 flex justify-between font-bold text-sm text-slate-800 mb-4">
                    <span>Total Tagihan:</span>
                    <span id="grandTotal" class="text-orange-600">Rp 0</span>
                </div>

                <div class="bg-white p-4 rounded-xl border border-orange-100 space-y-3 mb-4">
                    <h4 class="text-xs font-bold text-slate-700">📋 Data Pelanggan</h4>
                    <div>
                        <label class="text-[10px] font-semibold text-slate-500 block mb-1">Nama / Meja *</label>
                        <input type="text" id="mejaInput" placeholder="Meja 01 / Budi" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 text-xs outline-none">
                    </div>
                    <div>
                        <label class="text-[10px] font-semibold text-slate-500 block mb-1">WhatsApp</label>
                        <input type="text" id="waInput" placeholder="08123..." class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 text-xs outline-none">
                    </div>
                    <div>
                        <label class="text-[10px] font-semibold text-slate-500 block mb-1">Pembayaran *</label>
                        <select id="metodeBayar" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 text-xs outline-none cursor-pointer" onchange="toggleCash()">
                            <option value="Cash">Cash (Tunai)</option>
                            <option value="QRIS">QRIS</option>
                            <option value="Transfer">Transfer Bank</option>
                        </select>
                    </div>

                    <div id="cashBox" class="bg-orange-50/50 p-3 rounded-lg border border-orange-100">
                        <label class="text-[10px] font-semibold text-slate-600 block mb-1">Uang Tunai Diterima (Rp)</label>
                        <input type="number" id="uangBayar" placeholder="100000" class="w-full bg-white border border-slate-200 rounded-lg p-2 text-xs outline-none mb-2" oninput="calcChange()">
                        <div class="flex gap-1 mb-2">
                            <button type="button" onclick="setCash(20000)" class="bg-white border text-[10px] px-2 py-1 rounded font-medium shadow-sm">20rb</button>
                            <button type="button" onclick="setCash(50000)" class="bg-white border text-[10px] px-2 py-1 rounded font-medium shadow-sm">50rb</button>
                            <button type="button" onclick="setCash(100000)" class="bg-white border text-[10px] px-2 py-1 rounded font-medium shadow-sm">100rb</button>
                            <button type="button" onclick="setExact()" class="bg-orange-500 text-white text-[10px] px-2 py-1 rounded font-medium ml-auto">Pas</button>
                        </div>
                        <div class="flex justify-between text-xs font-bold text-slate-700">
                            <span>Kembalian:</span>
                            <span id="kembalian" class="text-emerald-600">Rp 0</span>
                        </div>
                    </div>

                    <label class="flex items-center gap-2 text-xs font-semibold text-slate-700 cursor-pointer pt-1">
                        <input type="checkbox" id="printCheck" checked class="w-4 h-4 accent-orange-500 rounded cursor-pointer"> 🖨️ Otomatis Print Struk Thermal
                    </label>
                </div>

                <button onclick="submitPOS()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-xl text-xs flex items-center justify-center gap-2 transition shadow-sm">
                    <i class="fa-solid fa-circle-check"></i> Simpan &amp; Proses Transaksi
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        import { supabase, authReady } from './js/supabase.js';
        let products = [];
        let cart = {};
        let grandTotal = 0;

        function rupiah(n) { return 'Rp ' + Number(n || 0).toLocaleString('id-ID'); }

        window.loadPOSMenu = async function() {
            await authReady;
            try {
                const { data } = await supabase.from('products').select('*');
                if (data) products = data;
            } catch (e) { console.warn(e); }

            const cats = new Set();
            products.forEach(p => { if (p.kategori || p.category) cats.add((p.kategori || p.category).toLowerCase()); });
            document.getElementById('filterKat').innerHTML = `<option value="Semua">All Kategori</option>` + Array.from(cats).map(c => `<option value="${c}">${c}</option>`).join('');
            renderGrid(products);
        };

        function renderGrid(items) {
            const list = document.getElementById('menuList');
            if (items.length === 0) {
                list.innerHTML = `<p class="col-span-full text-center text-slate-400 py-10 text-xs">Belum ada menu produk.</p>`;
                return;
            }
            list.innerHTML = items.map(p => {
                const nama = p.nama || p.name || '';
                const harga = Number(p.harga || p.price || 0);
                const foto = p.foto || p.image || 'https://placehold.co/150';
                const stok = Number(p.stok ?? 0);
                const habis = stok <= 0;

                return `
                    <div class="bg-white border border-slate-100 rounded-2xl p-3 text-center shadow-sm cursor-pointer hover:border-orange-500 transition ${habis ? 'opacity-40 pointer-events-none' : ''}" onclick="addToCart('${p.id}', \`${nama}\`, ${harga})">
                        <img src="${foto}" class="w-full h-24 object-cover rounded-xl mb-2" onerror="this.src='https://placehold.co/150'">
                        <h4 class="font-semibold text-xs text-slate-800 mb-1 truncate">${nama}</h4>
                        <p class="font-bold text-xs text-orange-600">${rupiah(harga)}</p>
                    </div>
                `;
            }).join('');
        }

        window.filterMenu = function() {
            const kw = document.getElementById('searchMenu').value.toLowerCase().trim();
            const cat = document.getElementById('filterKat').value.toLowerCase();
            const filtered = products.filter(p => {
                const nama = (p.nama || p.name || '').toLowerCase();
                const pCat = (p.kategori || p.category || '').toLowerCase();
                return nama.includes(kw) && (cat === 'semua' || pCat === cat);
            });
            renderGrid(filtered);
        };

        window.addToCart = function(id, nama, harga) {
            if (cart[id]) cart[id].qty++;
            else cart[id] = { id, nama, harga, qty: 1 };
            updateCartUI();
        };

        window.changeQty = function(id, delta) {
            if (!cart[id]) return;
            cart[id].qty += delta;
            if (cart[id].qty <= 0) delete cart[id];
            updateCartUI();
        };

        function updateCartUI() {
            const items = Object.values(cart);
            const container = document.getElementById('cartItems');
            const totalEl = document.getElementById('grandTotal');
            if (items.length === 0) {
                container.innerHTML = `<p class="text-center text-xs text-slate-400 py-6">Belum ada item dipilih.</p>`;
                totalEl.innerText = rupiah(0);
                grandTotal = 0;
                return;
            }
            let total = 0;
            container.innerHTML = items.map(i => {
                const sub = i.qty * i.harga;
                total += sub;
                return `
                    <div class="flex justify-between items-center text-xs">
                        <div>
                            <div class="font-semibold text-slate-800">${i.nama}</div>
                            <div class="text-[10px] text-slate-400">${rupiah(i.harga)}</div>
                        </div>
                        <div class="flex items-center gap-1.5 bg-white border px-2 py-1 rounded-lg">
                            <button onclick="changeQty('${i.id}', -1)" class="font-bold px-1">-</button>
                            <span class="font-bold w-4 text-center">${i.qty}</span>
                            <button onclick="changeQty('${i.id}', 1)" class="font-bold px-1">+</button>
                        </div>
                        <div class="font-bold text-slate-700 text-right">${rupiah(sub)}</div>
                    </div>
                `;
            }).join('');
            totalEl.innerText = rupiah(total);
            grandTotal = total;
            calcChange();
        }

        window.toggleCash = function() {
            const m = document.getElementById('metodeBayar').value;
            document.getElementById('cashBox').style.display = m === 'Cash' ? 'block' : 'none';
        };

        window.calcChange = function() {
            if (document.getElementById('metodeBayar').value !== 'Cash') return;
            const bayar = Number(document.getElementById('uangBayar').value) || 0;
            const kembali = bayar - grandTotal;
            const el = document.getElementById('kembalian');
            if (bayar === 0) el.innerText = rupiah(0);
            else if (kembali < 0) el.innerText = 'Uang Kurang!';
            else el.innerText = rupiah(kembali);
        };

        window.setCash = function(n) {
            document.getElementById('uangBayar').value = n;
            calcChange();
        };

        window.setExact = function() {
            document.getElementById('uangBayar').value = grandTotal;
            calcChange();
        };

        window.submitPOS = async function() {
            const items = Object.values(cart);
            if (items.length === 0) { alert('Struk kasir kosong!'); return; }
            const meja = document.getElementById('mejaInput').value.trim();
            if (!meja) { alert('Harap isi Nama / Meja pelanggan!'); return; }
            const wa = document.getElementById('waInput').value.trim();
            const metode = document.getElementById('metodeBayar').value;
            const autoPrint = document.getElementById('printCheck').checked;

            let bayar = grandTotal, kembali = 0;
            if (metode === 'Cash') {
                bayar = Number(document.getElementById('uangBayar').value) || 0;
                if (bayar < grandTotal) { alert('Uang tunai kurang!'); return; }
                kembali = bayar - grandTotal;
            }

            const orderId = 'KSR-' + Math.floor(1000 + Math.random() * 9000);
            const orderData = {
                order_id: orderId,
                customer_name: `Dine-In (${meja})`,
                phone: wa || '-',
                address: 'Makan di Tempat',
                items: items.map(i => ({ nama: i.nama, qty: i.qty, harga: i.harga })),
                grand_total: grandTotal,
                payment_method: metode,
                status: 'new',
                created_at: new Date().toISOString()
            };

            await authReady;
            try { await supabase.from('orders').insert([orderData]); } catch(e) { console.warn(e); }
            let localOrders = JSON.parse(localStorage.getItem('local_orders') || '[]');
            localOrders.push(orderData);
            localStorage.setItem('local_orders', JSON.stringify(localOrders));

            alert('Transaksi Dine-In berhasil disimpan!');
            if (autoPrint) printThermal(meja, items, grandTotal, metode, bayar, kembali);

            cart = {};
            document.getElementById('mejaInput').value = '';
            document.getElementById('waInput').value = '';
            document.getElementById('uangBayar').value = '';
            updateCartUI();
        };

        function printThermal(meja, items, total, metode, bayar, kembali) {
            const w = window.open('', '_blank', 'width=350,height=600');
            const tgl = new Date().toLocaleString('id-ID', { timeZone: 'Asia/Jakarta' });
            const list = items.map(i => `<div>${i.nama} x${i.qty} - ${rupiah(i.qty * i.harga)}</div>`).join('');
            w.document.write(`<html><head><style>body{font-family:monospace;width:48mm;font-size:11px;padding:2mm;}</style></head><body>
                <div style="text-align:center;font-weight:bold;font-size:13px;">CHIMCHUM MALANG</div>
                <div style="text-align:center;">Dine-In Struk</div><hr>
                Waktu: ${tgl}<br>Meja: ${meja}<hr>${list}<hr>
                <b>TOTAL: ${rupiah(total)}</b><br>Bayar: ${rupiah(bayar)}<br>Kembali: ${rupiah(kembali)}<hr>
                <div style="text-align:center;">Terima Kasih!</div>
                <script>window.onload=()=>window.print();<\/script>
            </body></html>`);
            w.document.close();
        }

        loadPOSMenu();
    </script>
</body>
</html>
