<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ChimChum Malang - Admin</title>

    <!-- Terapkan state header SEBELUM render agar tidak berkedip -->
    <script>
        try {
            if (localStorage.getItem('admin_header_hidden') === '1') {
                document.documentElement.classList.add('header-off');
            }
        } catch (e) {}
    </script>

    <link
        rel="icon"
        href="./assets/logo-transparan.png"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }

        .hidden-force {
            display: none !important;
        }

        .spinner {
            width: 22px;
            height: 22px;
            border: 3px solid rgba(255,255,255,.35);
            border-top-color: white;
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }

        .spinner-dark {
            width: 28px;
            height: 28px;
            border: 3px solid #e2e8f0;
            border-top-color: #f97316;
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ---------- Hide / show header ---------- */
        #adminHeader {
            max-height: 120px;
            transition:
                max-height .3s ease,
                padding .3s ease,
                border-width .3s ease,
                opacity .2s ease;
        }

        html.header-off #adminHeader {
            max-height: 0;
            padding-top: 0;
            padding-bottom: 0;
            border-bottom-width: 0;
            opacity: 0;
            overflow: hidden;
            pointer-events: none;
        }

        /* Tab kecil di tepi atas layar untuk memunculkan header lagi */
        #headerShowBtn {
            display: none;
        }

        html.header-off #headerShowBtn {
            display: flex;
        }
    </style>
</head>

<body class="bg-slate-100 text-slate-800 min-h-screen">

    <!-- =========================================================
         ADMIN APPLICATION
         HIDDEN UNTIL AUTHENTICATED
    ========================================================== -->
    <div
        id="adminApp"
        class="hidden-force h-screen flex flex-col overflow-hidden"
    >
        <!-- TAB "TAMPILKAN HEADER" (muncul hanya saat header disembunyikan) -->
        <button
            id="headerShowBtn"
            type="button"
            class="fixed top-0 left-1/2 -translate-x-1/2 z-30 w-14 h-4
                   items-center justify-center rounded-b-lg
                   bg-white border border-t-0 border-slate-200 shadow-sm
                   text-slate-400 hover:text-orange-600 hover:bg-orange-50 transition"
            title="Tampilkan header"
        >
            <i class="fa-solid fa-chevron-down text-[9px]"></i>
        </button>

        <!-- HEADER -->
        <header
            id="adminHeader"
            class="bg-white border-b border-slate-200 px-6 py-3.5 flex justify-between items-center shadow-sm shrink-0 z-20"
        >
            <div class="flex items-center gap-3">
                <img
                    src="./assets/logo-transparan.png"
                    alt="Logo"
                    class="h-10 w-10 object-cover rounded-lg"
                    onerror="this.src='https://placehold.co/40?text=CC'"
                >
                <div>
                    <h1 class="font-bold text-base text-orange-600 tracking-tight">
                        ChimChum Malang
                    </h1>

                    <p class="text-xs text-slate-500">
                        Admin Management System
                    </p>
                </div>
                <button
                    id="sidebarToggle"
                    type="button"
                    class="w-10 h-10 flex items-center justify-center rounded-xl
                           bg-slate-100 hover:bg-orange-100 hover:text-orange-600
                           text-slate-600 transition"
                    title="Buka/tutup sidebar"
                >
                    <i id="sidebarToggleIcon" class="fa-solid fa-bars"></i>
                </button>
            </div>

            <!-- HEADER RIGHT -->
            <div class="flex items-center gap-3">
                <!-- User -->
                <div
                    id="currentUser"
                    class="hidden md:flex items-center gap-2 text-xs text-slate-600 bg-slate-50 border border-slate-200 px-3 py-2 rounded-xl"
                >
                    <i class="fa-solid fa-user text-orange-500"></i>

                    <span id="currentUserEmail">
                        -
                    </span>
                </div>


                <!-- Status -->
                <!-- <span class="text-xs font-semibold text-emerald-700 bg-emerald-50 border border-emerald-200 px-3 py-1.5 rounded-full flex items-center gap-1.5">
                    <i class="fa-solid fa-shield-halved"></i>
                    Terautentikasi
                </span> -->


                <!-- Hide header -->
                <button
                    id="headerHideBtn"
                    type="button"
                    class="w-10 h-10 flex items-center justify-center rounded-xl
                           bg-slate-100 hover:bg-orange-100 hover:text-orange-600
                           text-slate-600 transition"
                    title="Sembunyikan header"
                >
                    <i class="fa-solid fa-chevron-up"></i>
                </button>


                <!-- Logout -->
                <button
                    id="logoutButton"
                    type="button"
                    class="text-sm font-semibold text-red-600 bg-red-50 hover:bg-red-100 border border-red-200 px-3 py-2 rounded-xl transition"
                    title="Logout"
                >
                    <i class="fa-solid fa-right-from-bracket mr-1"></i>
                    Logout
                </button>

            </div>

        </header>


        <!-- MAIN -->
        <div class="flex-1 flex overflow-hidden">

            <!-- SIDEBAR -->
            <aside
                id="adminSidebar"
                class="w-72 bg-white border-r border-slate-200 flex flex-col shrink-0
                       transition-all duration-300 overflow-hidden"
            >

                <div class="p-4 border-b border-slate-100 bg-slate-50/50">

                    <span class="text-xs font-bold uppercase tracking-wider text-slate-400">
                        Pilih Modul Sistem
                    </span>

                </div>


                <nav class="p-3 space-y-1.5 overflow-y-auto flex-1">

                    <!-- Kasir -->
                    <button
                        onclick="loadModule('kasir_dine_in', this)"
                        class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-sm text-slate-600 hover:bg-orange-50 hover:text-orange-600 transition text-left"
                    >
                        <i class="fa-solid fa-cash-register w-5 text-center"></i>
                        Kasir Dine-In
                    </button>

                    <!-- Pesanan -->
                    <button
                        onclick="loadModule('pesanan', this)"
                        class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-sm text-white bg-orange-500 shadow-sm shadow-orange-500/20 transition text-left"
                    >
                        <i class="fa-solid fa-receipt w-5 text-center"></i>
                        Pesanan Masuk
                    </button>


                    <!-- Produk -->
                    <button
                        onclick="loadModule('produk', this)"
                        class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-sm text-slate-600 hover:bg-orange-50 hover:text-orange-600 transition text-left"
                    >
                        <i class="fa-solid fa-box w-5 text-center"></i>
                        Katalog Menu
                    </button>


                    <!-- Stok -->
                    <button
                        onclick="loadModule('stok', this)"
                        class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-sm text-slate-600 hover:bg-orange-50 hover:text-orange-600 transition text-left"
                    >
                        <i class="fa-solid fa-warehouse w-5 text-center"></i>
                        Monitoring Stok Siap Jual
                    </button>


                    <!-- Laporan -->
                    <button
                        onclick="loadModule('laporan', this)"
                        class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-sm text-slate-600 hover:bg-orange-50 hover:text-orange-600 transition text-left"
                    >
                        <i class="fa-solid fa-chart-line w-5 text-center"></i>
                        Laporan Keuangan
                    </button>

                     <!-- Spacer 1 rows -->
                    <div class="h-3"></div>

                    <!-- Purchase Orders -->
                    <button onclick="loadModule('purchase_orders', this)" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-sm transition text-left bg-orange-500 text-white shadow-sm shadow-orange-500/20">
                        <i class="fa-solid fa-file-invoice w-5 text-center"></i>
                        Purchase Orders
                    </button>
                     <!-- Manage Order -->
                    <button
                        onclick="loadModule('manageorder', this)"
                        class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-sm text-white bg-orange-500 shadow-sm shadow-orange-500/20 transition text-left"
                    >
                        <i class="fa-solid fa-receipt w-5 text-center"></i>
                        Manage Order
                    </button>

                    <!-- Spacer 2 rows -->
                    <div class="h-6"></div>


                    <!-- Master Dapur -->
                    <button onclick="loadModule('master_resep', this)" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-sm transition text-left bg-orange-500 text-white shadow-sm shadow-orange-500/20">
                        <i class="fa-solid fa-book-open w-5 text-center"></i>
                        Master Kitchen & Stock
                    </button>
                    <!-- Master Supplier -->
                    <button onclick="loadModule('master_supplier', this)" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-sm transition text-left bg-orange-500 text-white shadow-sm shadow-orange-500/20">
                        <i class="fa-solid fa-truck-field w-5 text-center"></i>
                        Master Supplier
                    </button>
                    <div class="h-3"></div>

                    <!-- User Setup -->
                    <button onclick="loadModule('usersetup', this)" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-sm transition text-left bg-orange-500 text-white shadow-sm shadow-orange-500/20">
                        <i class="fa-solid fa-user-pen w-5 text-center"></i>
                        User Setup
                    </button>

                </nav>


                <div class="p-4 border-t border-slate-100 bg-slate-50 text-xs text-slate-400 text-center">
                    Modular Split Architecture v2.6
                </div>

            </aside>


            <!-- WORKSPACE -->
            <main class="flex-1 bg-slate-100 p-4 overflow-hidden flex flex-col">

                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 flex-1 overflow-hidden relative">

                    <!-- Loading iframe -->
                    <div
                        id="moduleLoading"
                        class="absolute inset-0 z-10 bg-white flex items-center justify-center pointer-events-none opacity-0 transition-opacity"
                    >
                        <div class="text-center">

                            <div class="spinner-dark mx-auto mb-3"></div>

                            <p class="text-sm text-slate-500">
                                Memuat modul...
                            </p>

                        </div>
                    </div>


                    <iframe
                        id="moduleFrame"
                        src="about:blank"
                        class="w-full h-full border-0"
                        title="Admin Module"
                    ></iframe>

                </div>

            </main>

        </div>

    </div>

    <!-- Toggle hide / show header -->
    <script>
        (function () {
            const root = document.documentElement;
            const KEY = 'admin_header_hidden';

            function setHeaderHidden(hidden) {
                root.classList.toggle('header-off', hidden);
                try {
                    localStorage.setItem(KEY, hidden ? '1' : '0');
                } catch (e) {}
            }

            document.getElementById('headerHideBtn')
                ?.addEventListener('click', () => setHeaderHidden(true));

            document.getElementById('headerShowBtn')
                ?.addEventListener('click', () => setHeaderHidden(false));
        })();
    </script>

    <script type="module">
        import { requireAuth } from './js/module/auth-guard.js';

        const auth = await requireAuth(['admin']);

        if (auth) {
            await import('./js/module/admin.js');
        }
    </script>

</body>
</html>
