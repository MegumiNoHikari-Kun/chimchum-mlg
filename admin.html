<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChimChum Malang - Multi-File Modular Admin Suite</title>
    <link rel="icon" type="image/jpeg" href="https://meguminohikari-kun.github.io/chimchum-malang/assets/logo-transparan.jpg" onerror="this.src='https://placehold.co/50?text=CC'">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 h-screen flex flex-col overflow-hidden">

    <header class="bg-white border-b border-slate-200 px-6 py-3.5 flex justify-between items-center shadow-sm shrink-0 z-20">
        <div class="flex items-center gap-3">
            <img src="https://meguminohikari-kun.github.io/chimchum-malang/assets/logo-transparan.jpg" alt="Logo" class="h-10 w-auto object-contain rounded-lg" onerror="this.src='https://placehold.co/40?text=CC'">
            <div>
                <h1 class="font-bold text-base text-orange-600 tracking-tight">ChimChum Malang</h1>
                <p class="text-xs text-slate-500">Modular Architecture with IFrame Router</p>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <span class="text-xs font-semibold text-emerald-700 bg-emerald-50 border border-emerald-200 px-3 py-1.5 rounded-full flex items-center gap-1.5">
                <i class="fa-solid fa-shield-halved"></i> Multi-File Engine Active
            </span>
        </div>
    </header>

    <div class="flex-1 flex overflow-hidden">
        <!-- Sidebar Navigation -->
        <aside class="w-72 bg-white border-r border-slate-200 flex flex-col shrink-0">
            <div class="p-4 border-b border-slate-100 bg-slate-50/50">
                <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Pilih Modul Sistem</span>
            </div>
            <nav class="p-3 space-y-1.5 overflow-y-auto flex-1">
                <button onclick="loadModule('pesanan', this)" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-sm text-slate-600 hover:bg-orange-50 hover:text-orange-600 transition text-left active bg-orange-500 text-white shadow-sm shadow-orange-500/20">
                    <i class="fa-solid fa-receipt w-5 text-center"></i> Pesanan Masuk
                </button>
                <button onclick="loadModule('kasir', this)" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-sm text-slate-600 hover:bg-orange-50 hover:text-orange-600 transition text-left">
                    <i class="fa-solid fa-cash-register w-5 text-center"></i> Kasir Dine-In
                </button>
                <button onclick="loadModule('produk', this)" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-sm text-slate-600 hover:bg-orange-50 hover:text-orange-600 transition text-left">
                    <i class="fa-solid fa-box w-5 text-center"></i> Kelola Produk
                </button>
                <button onclick="loadModule('stok', this)" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-sm text-slate-600 hover:bg-orange-50 hover:text-orange-600 transition text-left">
                    <i class="fa-solid fa-warehouse w-5 text-center"></i> Monitoring Stok
                </button>
                <button onclick="loadModule('laporan', this)" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-sm text-slate-600 hover:bg-orange-50 hover:text-orange-600 transition text-left">
                    <i class="fa-solid fa-chart-line w-5 text-center"></i> Laporan Keuangan
                </button>
            </nav>
            <div class="p-4 border-t border-slate-100 bg-slate-50 text-xs text-slate-400 text-center">
                Modular Split Architecture v2.6
            </div>
        </aside>

        <!-- Dynamic IFrame Workspace -->
        <main class="flex-1 bg-slate-100 p-4 overflow-hidden flex flex-col">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 flex-1 overflow-hidden relative">
                <iframe id="moduleFrame" src="pesanan.html" class="w-full h-full border-0"></iframe>
            </div>
        </main>
    </div>

    <script>
        function loadModule(moduleName, btnElement) {
            // Update active styling on sidebar buttons
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('bg-orange-500', 'text-white', 'shadow-sm', 'shadow-orange-500/20');
                btn.classList.add('text-slate-600', 'hover:bg-orange-50', 'hover:text-orange-600');
            });
            btnElement.classList.remove('text-slate-600', 'hover:bg-orange-50', 'hover:text-orange-600');
            btnElement.classList.add('bg-orange-500', 'text-white', 'shadow-sm', 'shadow-orange-500/20');

            // Set iframe source file
            const iframe = document.getElementById('moduleFrame');
            iframe.src = moduleName + '.html';
        }
    </script>
</body>
</html>
