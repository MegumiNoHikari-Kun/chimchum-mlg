<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kelola Voucher - ChimChum</title>
  <link rel="icon" type="image/png" href="./assets/logo-transparan.png">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="./css/kasir.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* ===== FIX SCROLL (override kasir.css yang mengunci tinggi layar) ===== */
    html, body { height:auto !important; min-height:100%; overflow-y:auto !important; overflow-x:hidden; }
    body { background:#f8fafc; font-family:'Poppins',sans-serif; color:#1e293b; }
    main.container { max-width:1100px; margin:0 auto; padding:20px 16px 48px; height:auto !important; max-height:none !important; overflow:visible !important; }
    .table-wrap { max-height:none !important; }
    tr[hidden] { display:none !important; }

    /* ===== TAMPILAN ===== */
    main.container .card { background:#fff; border:1px solid #e2e8f0; border-radius:16px; box-shadow:0 1px 3px rgba(15,23,42,.06); }
    main.container h3 { font-size:15px; font-weight:600; margin:0; color:#1e293b; }
    main.container h3 i { color:#f97316; margin-right:6px; }
    main.container .card p { font-size:12px; color:#64748b; margin:2px 0 0; }
    .orders-toolbar { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; padding:16px 18px; margin-bottom:12px; }

    .v-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; }
    .v-grid label { display:block; }
    .v-grid .field-label { display:block; font-size:12px; font-weight:500; color:#475569; margin-bottom:4px; }
    .v-grid input, .v-grid select { width:100%; margin:0; box-sizing:border-box; padding:9px 12px; border:1px solid #e2e8f0; border-radius:10px; font:inherit; font-size:13px; background:#fff; transition:border-color .15s, box-shadow .15s; }
    .v-grid input:focus, .v-grid select:focus { outline:none; border-color:#f97316; box-shadow:0 0 0 3px rgba(249,115,22,.15); }
    .v-actions { display:flex; gap:8px; margin-top:16px; flex-wrap:wrap; }
    .v-badge { padding:2px 8px; border-radius:999px; font-size:11px; font-weight:600; color:#fff; white-space:nowrap; }
    .v-btn { padding:6px 10px; font-size:12px; border:1px solid #e2e8f0; background:#f1f5f9; border-radius:8px; cursor:pointer; transition:background .15s; }
    .v-btn:hover { background:#e2e8f0; }
    .v-btn--danger { color:#dc2626; }
    .v-btn--danger:hover { background:#fee2e2; }
    .v-hint { font-size:11px; color:#94a3b8; margin-top:2px; display:block; }

    /* Tabel */
    .table-wrap { overflow-x:auto; background:#fff; border:1px solid #e2e8f0; border-radius:16px; box-shadow:0 1px 3px rgba(15,23,42,.06); }
    .table-wrap table { width:100%; border-collapse:collapse; font-size:13px; }
    .table-wrap thead th { background:#fff7ed; color:#334155; font-size:12px; font-weight:600; text-align:left; padding:12px 14px; white-space:nowrap; }
    .table-wrap tbody td { padding:12px 14px; border-bottom:1px solid #f1f5f9; vertical-align:middle; }
    .table-wrap tbody tr:hover { background:#f8fafc; }
    .table-empty { text-align:center; color:#94a3b8; padding:32px 14px !important; }

    /* Cari + pagination */
    .v-tools { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .v-search { position:relative; }
    .v-search i { position:absolute; left:11px; top:50%; transform:translateY(-50%); color:#94a3b8; font-size:12px; pointer-events:none; }
    .v-search input { padding:8px 12px 8px 30px; width:230px; max-width:100%; border:1px solid #e2e8f0; border-radius:10px; font:inherit; font-size:12px; background:#f8fafc; }
    .v-search input:focus { outline:none; border-color:#f97316; background:#fff; box-shadow:0 0 0 3px rgba(249,115,22,.15); }
    .v-pager { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; padding:12px 4px; font-size:12px; color:#64748b; }
    .v-pager select { border:1px solid #e2e8f0; border-radius:8px; padding:4px 8px; font:inherit; font-size:12px; background:#fff; margin-left:8px; }
    .v-pager button { padding:6px 12px; border:1px solid #e2e8f0; background:#fff; border-radius:8px; font:inherit; font-size:12px; font-weight:500; cursor:pointer; }
    .v-pager button:hover:not(:disabled) { background:#f1f5f9; }
    .v-pager button:disabled { opacity:.4; cursor:not-allowed; }
    #vNoResult { display:none; text-align:center; color:#94a3b8; font-size:13px; padding:24px 0; }
  </style>
</head>
<body>

  <!-- <header class="app-header">
    <a class="app-header__logo" href="kasir.html">
      <img src="./assets/logo-transparan.png" alt="Logo" onerror="this.style.display='none'">
      <h2 class="app-header__title">ChimChum <span>Kelola Voucher</span></h2>
    </a>
    <div class="header-controls">
      <a href="kasir.html" class="btn-secondary" style="text-decoration:none;">
        <i class="fa-solid fa-arrow-left"></i> Kembali ke Kasir
      </a>
    </div>
  </header> -->

  <main class="container">

    <!-- FORM -->
    <section class="card" style="padding:18px;margin-bottom:18px;">
      <h3 id="voucherFormTitle"><i class="fa-solid fa-ticket"></i> Tambah Voucher</h3>

      <input type="hidden" id="vId">

      <div class="v-grid" style="margin-top:12px;">
        <label>
          <span class="field-label">Kode *</span>
          <input type="text" id="vCode" placeholder="DISKON10" style="text-transform:uppercase;">
        </label>
        <label>
          <span class="field-label">Deskripsi</span>
          <input type="text" id="vDesc" placeholder="Diskon 10% maks 20rb">
        </label>
        <label>
          <span class="field-label">Jenis Diskon *</span>
          <select id="vType" onchange="window.onVoucherTypeChange()">
            <option value="percent">Persen (%)</option>
            <option value="nominal">Nominal (Rp)</option>
          </select>
        </label>
        <label>
          <span class="field-label" id="vValueLabel">Nilai Diskon (%) *</span>
          <input type="number" id="vValue" min="1" placeholder="10">
        </label>
        <label id="vMaxWrap">
          <span class="field-label">Maks. Diskon (Rp)</span>
          <input type="number" id="vMax" min="0" placeholder="20000">
          <small class="v-hint">Kosongkan jika tanpa batas</small>
        </label>
        <label>
          <span class="field-label">Minimal Belanja (Rp)</span>
          <input type="number" id="vMin" min="0" value="0">
        </label>
        <label>
          <span class="field-label">Kuota</span>
          <input type="number" id="vQuota" min="1" placeholder="Tanpa batas">
          <small class="v-hint">Kosongkan jika tanpa batas</small>
        </label>
        <label>
          <span class="field-label">Mulai Berlaku</span>
          <input type="datetime-local" id="vStart">
        </label>
        <label>
          <span class="field-label">Berakhir</span>
          <input type="datetime-local" id="vEnd">
        </label>
        <label style="display:flex;align-items:center;gap:8px;margin-top:22px;">
          <input type="checkbox" id="vActive" checked style="width:auto;margin:0;">
          <span>Voucher aktif</span>
        </label>
      </div>

      <div class="v-actions">
        <button type="button" class="btn-submit" id="btnSaveVoucher" style="width:auto;padding:10px 20px;" onclick="window.saveVoucher()">
          <i class="fa-solid fa-floppy-disk"></i> Simpan
        </button>
        <button type="button" class="btn-secondary" id="btnCancelEdit" style="display:none;" onclick="window.resetVoucherForm()">
          Batal Edit
        </button>
      </div>
    </section>

    <!-- LIST -->
    <section>
      <div class="card orders-toolbar">
        <div>
          <h3><i class="fa-solid fa-list"></i> Daftar Voucher</h3>
          <p>Kelola voucher diskon yang bisa dipakai di kasir.</p>
        </div>
        <div class="v-tools">
          <div class="v-search">
            <i class="fa-solid fa-search"></i>
            <input type="text" id="vSearch" placeholder="Cari kode, diskon, status...">
          </div>
          <button type="button" class="btn-secondary" onclick="window.loadVouchers()">
            <i class="fa-solid fa-rotate-right"></i> Refresh
          </button>
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Kode</th>
              <th>Diskon</th>
              <th>Min. Belanja</th>
              <th>Pemakaian</th>
              <th>Periode</th>
              <th>Status</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="voucherTableBody">
            <tr><td colspan="7" class="table-empty">Memuat voucher...</td></tr>
          </tbody>
        </table>
        <div id="vNoResult">Tidak ada voucher yang cocok dengan pencarian.</div>
      </div>

      <div class="v-pager">
        <div>
          <span id="vPagerInfo">-</span>
          <select id="vPerPage">
            <option value="5">5 per halaman</option>
            <option value="10" selected>10 per halaman</option>
            <option value="25">25 per halaman</option>
            <option value="50">50 per halaman</option>
          </select>
        </div>
        <div style="display:flex;align-items:center;gap:6px;">
          <button type="button" id="vPrev">Prev</button>
          <span id="vPageLabel" style="padding:0 8px;font-weight:500;color:#334155;">Halaman 1 dari 1</span>
          <button type="button" id="vNext">Next</button>
        </div>
      </div>
    </section>

  </main>

  <!-- PENCARIAN + PAGINATION (bekerja di atas baris yang digambar voucher.js, tanpa mengubah voucher.js) -->
  <script>
    (function () {
      const tbody = document.getElementById('voucherTableBody');
      const $ = id => document.getElementById(id);
      let page = 1, perPage = 10, q = '', timer;

      // Baris "Memuat..." / "Belum ada voucher" (satu sel melebar) bukan data voucher
      const isDataRow = tr => !tr.querySelector('td.table-empty') && !(tr.children.length === 1 && tr.children[0].colSpan > 1);

      function apply() {
        const rows = [...tbody.querySelectorAll(':scope > tr')];
        const data = rows.filter(isDataRow);
        const match = data.filter(tr => tr.textContent.toLowerCase().includes(q));
        const pages = Math.max(1, Math.ceil(match.length / perPage));
        if (page > pages) page = pages;
        if (page < 1) page = 1;
        const start = (page - 1) * perPage, end = start + perPage;

        rows.forEach(tr => {
          if (!isDataRow(tr)) { tr.hidden = false; return; }
          const i = match.indexOf(tr);
          tr.hidden = i < start || i >= end;
        });

        $('vNoResult').style.display = data.length > 0 && match.length === 0 ? 'block' : 'none';
        $('vPagerInfo').textContent = match.length
          ? `Menampilkan ${start + 1}-${Math.min(end, match.length)} dari ${match.length} voucher`
          : (data.length ? 'Tidak ada hasil' : 'Belum ada voucher');
        $('vPageLabel').textContent = `Halaman ${page} dari ${pages}`;
        $('vPrev').disabled = page <= 1;
        $('vNext').disabled = page >= pages;
      }

      $('vSearch').addEventListener('input', e => {
        clearTimeout(timer);
        timer = setTimeout(() => { q = (e.target.value || '').toLowerCase().trim(); page = 1; apply(); }, 150);
      });
      $('vPerPage').addEventListener('change', e => { perPage = parseInt(e.target.value, 10) || 10; page = 1; apply(); });
      $('vPrev').addEventListener('click', () => { page--; apply(); });
      $('vNext').addEventListener('click', () => { page++; apply(); });

      // Saat voucher.js menggambar ulang tabel (load/simpan/hapus/refresh), terapkan lagi.
      // Hanya memantau penambahan/penghapusan baris; menyembunyikan baris (atribut hidden) tidak memicu loop.
      new MutationObserver(apply).observe(tbody, { childList: true });
      apply();
    })();
  </script>

  <script type="module">
    import { requireAuth } from './js/module/auth-guard.js';

    try {
      // Sesuaikan role. Contoh hanya admin: ['admin']
      const auth = await requireAuth(['admin', 'kasir']);
      if (auth) {
        await import('./js/module/voucher.js');
      } else {
        console.error('AUTH GAGAL');
      }
    } catch (error) {
      console.error('ERROR AUTH / IMPORT VOUCHER:', error);
    }
  </script>

</body>
</html>
