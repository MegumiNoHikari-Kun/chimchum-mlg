<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesanan Masuk - ChimChum</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>body { font-family: 'Poppins', sans-serif; }</style>
</head>
<body class="bg-white p-6 overflow-y-auto">
    <div class="max-w-6xl mx-auto">
        <div class="flex justify-between items-center mb-6 flex-wrap gap-4 border-b pb-4">
            <div>
                <h2 class="text-xl font-bold text-slate-800"><i class="fa-solid fa-receipt text-orange-500 mr-2"></i> Riwayat Pesanan Masuk</h2>
                <p class="text-xs text-slate-500">Kelola status pesanan online dan offline secara real-time.</p>
            </div>
            <button onclick="loadOrders()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-xl text-xs font-semibold flex items-center gap-2 transition">
                <i class="fa-solid fa-rotate-right"></i> Refresh Data
            </button>
        </div>

        <div id="orderSummary" class="grid grid-cols-2 md:grid-cols-6 gap-3 mb-6"></div>

        <div class="overflow-x-auto border border-slate-100 rounded-2xl shadow-sm">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-orange-50 text-slate-700 text-xs font-semibold">
                        <th class="p-3.5">Waktu</th>
                        <th class="p-3.5">Pelanggan</th>
                        <th class="p-3.5">WhatsApp</th>
                        <th class="p-3.5">Tipe / Bayar</th>
                        <th class="p-3.5">Status</th>
                        <th class="p-3.5">Item Pesanan</th>
                        <th class="p-3.5">Total</th>
                        <th class="p-3.5">Aksi</th>
                    </tr>
                </thead>
                <tbody id="ordersBody" class="divide-y divide-slate-100 text-xs">
                    <tr><td colspan="8" class="text-center py-10 text-slate-400">Memuat pesanan...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { initPesanan } from './js/module/pesanan.js';
    
        initPesanan();
    </script>
</body>
</html>
