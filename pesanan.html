<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesanan Masuk - ChimChum</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Poppins', sans-serif; }
        th.sortable { cursor: pointer; user-select: none; white-space: nowrap; }
        th.sortable:hover { background: #ffedd5; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { scrollbar-width: none; }
        @keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
        .toast-in { animation: toast-in .2s ease-out; }
    </style>
</head>
<body class="bg-slate-50 p-4 md:p-6 overflow-y-auto text-slate-700">
    <div class="max-w-7xl mx-auto">

        <!-- Header -->
        <div class="flex justify-between items-start mb-5 flex-wrap gap-3">
            <div>
                <h2 class="text-lg md:text-xl font-bold text-slate-800 flex items-center gap-2">
                    <span class="w-9 h-9 rounded-xl bg-orange-100 text-orange-600 flex items-center justify-center text-base">
                        <i class="fa-solid fa-receipt"></i>
                    </span>
                    Riwayat Pesanan Masuk
                </h2>
                <p class="text-xs text-slate-500 mt-1 flex items-center gap-2 flex-wrap">
                    <span>Kelola status pesanan online dan offline.</span>
                    <span id="liveBadge" class="hidden items-center gap-1 text-emerald-600 font-medium">
                        <span class="relative flex h-2 w-2">
                            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                            <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                        </span>
                        Live
                    </span>
                    <span id="lastUpdated" class="text-slate-400"></span>
                </p>
            </div>
            <button id="refreshBtn" onclick="loadOrders()" class="bg-white border border-slate-200 hover:bg-slate-100 text-slate-700 px-4 py-2 rounded-xl text-xs font-semibold flex items-center gap-2 transition shadow-sm disabled:opacity-60">
                <i id="refreshIcon" class="fa-solid fa-rotate-right"></i> Refresh
            </button>
        </div>

        <!-- Ringkasan status (juga berfungsi sebagai filter) -->
        <div id="orderSummary" class="flex md:grid md:grid-cols-6 gap-2.5 mb-5 overflow-x-auto no-scrollbar -mx-4 px-4 md:mx-0 md:px-0"></div>

        <!-- Toolbar -->
        <div class="bg-white border border-slate-200 rounded-2xl p-3 mb-3 shadow-sm flex flex-wrap items-center gap-2">
            <div class="relative w-full lg:w-80">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
                    <i class="fa-solid fa-magnifying-glass text-xs"></i>
                </span>
                <input
                    type="search"
                    id="orderSearchInput"
                    oninput="handleSearchInput(event)"
                    placeholder="Cari nama, HP, ID, item, total, tanggal…  ( / )"
                    autocomplete="off"
                    class="w-full pl-9 pr-9 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs text-slate-800 focus:outline-none focus:border-orange-400 focus:ring-2 focus:ring-orange-100 transition [&::-webkit-search-cancel-button]:hidden"
                >
                <button id="searchClear" onclick="clearSearch()" class="hidden absolute inset-y-0 right-0 pr-3 text-slate-400 hover:text-slate-600" title="Hapus pencarian">
                    <i class="fa-solid fa-circle-xmark text-xs"></i>
                </button>
            </div>

            <div class="flex items-center gap-2 flex-wrap flex-1">
                <select id="monthFilter" onchange="changeMonth(event)" class="bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs font-medium text-slate-700 outline-none cursor-pointer focus:border-orange-400"></select>
                <select id="yearFilter" onchange="changeYear(event)" class="bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs font-medium text-slate-700 outline-none cursor-pointer focus:border-orange-400"></select>

                <!-- Urutkan (berguna di HP karena header tabel tidak tampil) -->
                <select id="sortSelect" onchange="changeSort(event)" class="md:hidden bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs font-medium text-slate-700 outline-none cursor-pointer focus:border-orange-400">
                    <option value="created_at:desc">Terbaru</option>
                    <option value="created_at:asc">Terlama</option>
                    <option value="grand_total:desc">Total tertinggi</option>
                    <option value="grand_total:asc">Total terendah</option>
                    <option value="customer_name:asc">Nama A–Z</option>
                    <option value="status:asc">Status</option>
                </select>

                <button onclick="setThisMonth()" class="px-3 py-2 text-xs font-semibold rounded-lg bg-orange-50 text-orange-700 hover:bg-orange-100 transition">
                    <i class="fa-solid fa-calendar-day mr-1"></i> Bulan Ini
                </button>
                <button id="resetBtn" onclick="resetFilters()" class="px-3 py-2 text-xs font-semibold rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 transition">
                    <i class="fa-solid fa-filter-circle-xmark mr-1"></i> Reset
                </button>
            </div>
        </div>

        <!-- Daftar pesanan -->
        <div class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
            <!-- Desktop: tabel -->
            <div class="hidden md:block overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-orange-50/70 text-slate-600 text-[11px] font-semibold uppercase tracking-wide border-b border-orange-100">
                            <th class="p-3 sortable" onclick="sortBy('created_at')">Waktu <i id="sort-created_at" class="fa-solid fa-sort text-slate-300 ml-1"></i></th>
                            <th class="p-3 sortable" onclick="sortBy('customer_name')">Pelanggan <i id="sort-customer_name" class="fa-solid fa-sort text-slate-300 ml-1"></i></th>
                            <th class="p-3 sortable" onclick="sortBy('payment_method')">Pembayaran <i id="sort-payment_method" class="fa-solid fa-sort text-slate-300 ml-1"></i></th>
                            <th class="p-3 sortable" onclick="sortBy('status')">Status <i id="sort-status" class="fa-solid fa-sort text-slate-300 ml-1"></i></th>
                            <th class="p-3 sortable" onclick="sortBy('items')">Item Pesanan <i id="sort-items" class="fa-solid fa-sort text-slate-300 ml-1"></i></th>
                            <th class="p-3 sortable text-right" onclick="sortBy('grand_total')">Total <i id="sort-grand_total" class="fa-solid fa-sort text-slate-300 ml-1"></i></th>
                            <th class="p-3 text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="ordersBody" class="divide-y divide-slate-100 text-xs">
                        <tr><td colspan="7" class="text-center py-10 text-slate-400">Memuat pesanan...</td></tr>
                    </tbody>
                </table>
            </div>

            <!-- HP: kartu -->
            <div id="ordersCards" class="md:hidden divide-y divide-slate-100"></div>

            <div id="orderPagination" class="flex flex-col sm:flex-row items-center justify-between gap-3 px-4 py-3 border-t border-slate-100 text-xs text-slate-600"></div>
        </div>
    </div>

    <div id="toastHost" class="fixed bottom-4 right-4 left-4 sm:left-auto z-[80] flex flex-col gap-2 items-end pointer-events-none"></div>

    <script type="module">
        import { requireAuth } from './js/module/auth-guard.js';

        const auth = await requireAuth(['admin']);

        if (auth) {
            await import('./js/module/pesanan.js');
        }
    </script>
</body>
</html>
