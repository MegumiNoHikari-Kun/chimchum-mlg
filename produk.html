<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kelola Produk - ChimChum</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }

        input,
        textarea,
        button {
            font-family: inherit;
        }

        .loading-spinner {
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body class="bg-white p-4 sm:p-6 overflow-y-auto">

<div class="max-w-6xl mx-auto">

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <div class="flex flex-col lg:flex-row lg:justify-between lg:items-center gap-4 mb-6 border-b pb-4">

        <div>

            <h3
                id="formTitle"
                class="font-bold text-base text-slate-800 flex items-center gap-2"
            >
                <i class="fa-solid fa-plus-circle text-orange-500"></i>
                Tambah Produk
            </h3>

            <p class="text-xs text-slate-500 mt-1">
                Kelola katalog menu makanan & minuman ChimChum.
            </p>

        </div>


        <div class="w-full lg:w-80">

            <div class="relative">

                <i
                    class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xs"
                ></i>

                <input
                    type="text"
                    id="p-search"
                    placeholder="Cari nama produk atau kategori..."
                    autocomplete="off"
                    class="bg-slate-50 border border-slate-200 rounded-xl pl-10 pr-4 py-2.5 text-xs outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-100 w-full transition"
                >

            </div>

        </div>

    </div>


    <!-- =====================================================
         STATUS
    ====================================================== -->

    <div
        id="statusBox"
        class="hidden mb-5 rounded-xl px-4 py-3 text-xs"
    ></div>


    <!-- =====================================================
         FORM PRODUK
    ====================================================== -->

    <div class="bg-slate-50 border border-slate-100 rounded-2xl p-4 sm:p-5 mb-6 shadow-sm">

        <input
            type="hidden"
            id="p-id"
        >


        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 mb-3">

            <!-- NAMA -->

            <div>

                <label class="block text-[11px] font-medium text-slate-600 mb-1">
                    Nama Produk
                    <span class="text-red-500">*</span>
                </label>

                <input
                    id="p-nama"
                    type="text"
                    maxlength="150"
                    placeholder="Contoh: Dimsum Ayam"
                    class="bg-white border border-slate-200 rounded-xl p-2.5 text-xs outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-100 w-full transition"
                >

            </div>


            <!-- KATEGORI -->

            <div>

                <label class="block text-[11px] font-medium text-slate-600 mb-1">
                    Kategori
                </label>

                <input
                    id="p-kategori"
                    type="text"
                    maxlength="80"
                    placeholder="Contoh: dimsum"
                    class="bg-white border border-slate-200 rounded-xl p-2.5 text-xs outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-100 w-full transition"
                >

            </div>


            <!-- HARGA -->

            <div>

                <label class="block text-[11px] font-medium text-slate-600 mb-1">
                    Harga Jual (Rp)
                    <span class="text-red-500">*</span>
                </label>

                <input
                    type="number"
                    id="p-harga"
                    min="1"
                    step="1"
                    placeholder="25000"
                    class="bg-white border border-slate-200 rounded-xl p-2.5 text-xs outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-100 w-full transition"
                >

            </div>


            <!-- HPP -->

            <div>

                <label class="block text-[11px] font-medium text-slate-600 mb-1">
                    HPP (Rp)
                </label>

                <input
                    type="number"
                    id="p-hpp"
                    min="0"
                    step="1"
                    placeholder="10000"
                    class="bg-white border border-slate-200 rounded-xl p-2.5 text-xs outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-100 w-full transition"
                >

            </div>


            <!-- STOK -->

            <div>

                <label class="block text-[11px] font-medium text-slate-600 mb-1">
                    Stok Porsi
                </label>

                <input
                    type="number"
                    id="p-stok"
                    min="0"
                    step="1"
                    placeholder="30"
                    class="bg-white border border-slate-200 rounded-xl p-2.5 text-xs outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-100 w-full transition"
                >

            </div>


            <!-- FOTO -->

            <div>

                <label class="block text-[11px] font-medium text-slate-600 mb-1">
                    URL Foto Produk
                </label>

                <input
                    id="p-foto"
                    type="url"
                    maxlength="1000"
                    placeholder="https://..."
                    class="bg-white border border-slate-200 rounded-xl p-2.5 text-xs outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-100 w-full transition"
                >

            </div>

        </div>


        <!-- DESKRIPSI -->

        <div class="mb-3">

            <label class="block text-[11px] font-medium text-slate-600 mb-1">
                Deskripsi
            </label>

            <textarea
                id="p-deskripsi"
                maxlength="500"
                placeholder="Deskripsi produk singkat..."
                rows="3"
                class="w-full bg-white border border-slate-200 rounded-xl p-2.5 text-xs outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-100 transition resize-none"
            ></textarea>

        </div>


        <!-- PREVIEW FOTO -->

        <div
            id="photoPreview"
            class="hidden mb-4 bg-white border border-slate-200 rounded-xl p-3"
        >

            <div class="flex items-center gap-3">

                <img
                    id="previewImage"
                    src=""
                    alt="Preview produk"
                    class="w-16 h-16 rounded-xl object-cover border border-slate-200"
                >

                <div>

                    <p class="text-xs font-semibold text-slate-700">
                        Preview Foto
                    </p>

                    <p class="text-[10px] text-slate-400 mt-1">
                        Preview gambar produk.
                    </p>

                </div>

            </div>

        </div>


        <!-- BUTTON -->

        <div class="flex flex-wrap gap-2">

            <button
                id="btnSave"
                type="button"
                class="bg-orange-500 hover:bg-orange-600 disabled:bg-orange-300 disabled:cursor-not-allowed text-white font-semibold px-5 py-2.5 rounded-xl text-xs transition shadow-sm"
            >

                <i class="fa-solid fa-save mr-1"></i>

                <span id="btnSaveText">
                    Simpan Produk
                </span>

            </button>


            <button
                id="btnCancelEdit"
                type="button"
                class="hidden bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold px-4 py-2.5 rounded-xl text-xs transition"
            >

                <i class="fa-solid fa-xmark mr-1"></i>

                Batal Edit

            </button>


            <button
                id="btnRefresh"
                type="button"
                class="bg-white border border-slate-200 hover:bg-slate-100 text-slate-600 font-semibold px-4 py-2.5 rounded-xl text-xs transition"
            >

                <i class="fa-solid fa-rotate mr-1"></i>

                Refresh

            </button>

        </div>

    </div>


    <!-- =====================================================
         TABLE HEADER
    ====================================================== -->

    <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-2 mb-3">

        <div>

            <h4 class="font-bold text-sm text-slate-800">
                Daftar Produk
            </h4>

            <p
                id="productCount"
                class="text-[10px] text-slate-400 mt-0.5"
            >
                Memuat...
            </p>

        </div>


        <div
            id="connectionStatus"
            class="text-[10px] text-slate-400"
        >

            <i class="fa-solid fa-circle-notch loading-spinner mr-1"></i>

            Menghubungkan...

        </div>

    </div>


    <!-- =====================================================
         TABLE
    ====================================================== -->

    <div class="overflow-x-auto border border-slate-100 rounded-2xl shadow-sm">

        <table class="w-full text-left border-collapse text-xs">

            <thead>

                <tr class="bg-orange-50 text-slate-700 font-semibold">

                    <th class="p-3.5 min-w-[70px]">
                        Foto
                    </th>

                    <th class="p-3.5 min-w-[180px]">
                        Nama
                    </th>

                    <th class="p-3.5 min-w-[110px]">
                        Kategori
                    </th>

                    <th class="p-3.5 min-w-[120px]">
                        Harga Jual
                    </th>

                    <th class="p-3.5 min-w-[120px]">
                        HPP
                    </th>

                    <th class="p-3.5 min-w-[80px]">
                        Stok
                    </th>

                    <th class="p-3.5 min-w-[100px]">
                        Aksi
                    </th>

                </tr>

            </thead>


            <tbody
                id="prodTable"
                class="divide-y divide-slate-100"
            >

                <tr>

                    <td
                        colspan="7"
                        class="text-center py-10 text-slate-400"
                    >

                        <i class="fa-solid fa-circle-notch loading-spinner text-orange-500 mr-2"></i>

                        Memuat produk...

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>


<script type="module">

import {
    supabase,
    authReady
} from './js/supabase.js';


// =========================================================
// STATE
// =========================================================

let products = [];

let usingLocalStorage = false;

let isSaving = false;

let isDeleting = false;


// =========================================================
// DOM HELPER
// =========================================================

const $ = (id) => document.getElementById(id);


// =========================================================
// FORMAT RUPIAH
// =========================================================

function rupiah(value) {

    const number = Number(value || 0);

    return 'Rp ' +
        number.toLocaleString('id-ID');

}


// =========================================================
// ESCAPE HTML
// =========================================================

function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return '';
    }

    return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');

}


// =========================================================
// GETTERS
// =========================================================

function getProductName(product) {

    return String(
        product?.nama ??
        product?.name ??
        ''
    ).trim();

}


function getProductCategory(product) {

    return String(
        product?.kategori ??
        product?.category ??
        ''
    ).trim();

}


function getProductPrice(product) {

    return Number(
        product?.harga ??
        product?.price ??
        0
    );

}


function getProductHpp(product) {

    return Number(
        product?.hpp ??
        0
    );

}


function getProductStock(product) {

    return Number(
        product?.stok ??
        product?.stock ??
        0
    );

}


function getProductImage(product) {

    return String(
        product?.foto ??
        product?.image ??
        ''
    ).trim();

}


function getProductDescription(product) {

    return String(
        product?.deskripsi ??
        product?.desc ??
        ''
    ).trim();

}


// =========================================================
// URL IMAGE
// =========================================================

function validImageUrl(url) {

    if (!url) {
        return false;
    }

    try {

        const parsed =
            new URL(url);

        return (
            parsed.protocol === 'http:' ||
            parsed.protocol === 'https:'
        );

    } catch {

        return false;

    }

}


function fallbackImage() {

    return 'https://placehold.co/80x80?text=Produk';

}


// =========================================================
// LOCAL STORAGE
// =========================================================

function saveLocalProducts() {

    try {

        localStorage.setItem(
            'local_products',
            JSON.stringify(products)
        );

    } catch (error) {

        console.warn(
            'LocalStorage gagal:',
            error
        );

    }

}


// =========================================================
// STATUS MESSAGE
// =========================================================

function showStatus(
    message,
    type = 'success'
) {

    const box =
        $('statusBox');

    if (!box) return;


    box.className =
        'mb-5 rounded-xl px-4 py-3 text-xs border';


    if (type === 'success') {

        box.classList.add(
            'bg-emerald-50',
            'text-emerald-700',
            'border-emerald-200'
        );

        box.innerHTML =
            '<i class="fa-solid fa-circle-check mr-2"></i>' +
            escapeHtml(message);

    }

    else if (type === 'warning') {

        box.classList.add(
            'bg-amber-50',
            'text-amber-700',
            'border-amber-200'
        );

        box.innerHTML =
            '<i class="fa-solid fa-triangle-exclamation mr-2"></i>' +
            escapeHtml(message);

    }

    else {

        box.classList.add(
            'bg-red-50',
            'text-red-700',
            'border-red-200'
        );

        box.innerHTML =
            '<i class="fa-solid fa-circle-exclamation mr-2"></i>' +
            escapeHtml(message);

    }

}


function hideStatus() {

    $('statusBox')
        ?.classList
        .add('hidden');

}


// =========================================================
// CONNECTION STATUS
// =========================================================

function setConnectionStatus(
    connected,
    localMode = false
) {

    const element =
        $('connectionStatus');

    if (!element) return;


    if (localMode) {

        element.className =
            'text-[10px] text-amber-600';

        element.innerHTML =
            '<i class="fa-solid fa-hard-drive mr-1"></i>' +
            'Mode Local Storage';

        return;

    }


    if (connected) {

        element.className =
            'text-[10px] text-emerald-600';

        element.innerHTML =
            '<i class="fa-solid fa-circle-check mr-1"></i>' +
            'Terhubung ke Supabase';

    }

    else {

        element.className =
            'text-[10px] text-red-600';

        element.innerHTML =
            '<i class="fa-solid fa-circle-xmark mr-1"></i>' +
            'Supabase tidak terhubung';

    }

}


// =========================================================
// AUTH CHECK
// =========================================================

async function checkAuth() {

    try {

        await authReady;

        const {
            data,
            error
        } =
            await supabase.auth.getSession();


        if (error) {

            console.warn(
                'getSession error:',
                error
            );

            return null;

        }


        const session =
            data?.session || null;


        console.log(
            'Supabase session:',
            session
                ? {
                    user_id:
                        session.user?.id,
                    email:
                        session.user?.email
                }
                : null
        );


        return session;

    }

    catch (error) {

        console.warn(
            'Auth check gagal:',
            error
        );

        return null;

    }

}


// =========================================================
// LOAD PRODUCTS
// =========================================================

async function loadProducts() {

    const tbody =
        $('prodTable');


    if (tbody) {

        tbody.innerHTML = `
            <tr>
                <td
                    colspan="7"
                    class="text-center py-10 text-slate-400"
                >
                    <i class="fa-solid fa-circle-notch loading-spinner text-orange-500 mr-2"></i>
                    Memuat produk...
                </td>
            </tr>
        `;

    }


    try {

        await authReady;


        const {
            data,
            error
        } =
            await supabase
                .from('products')
                .select('*')
                .order(
                    'nama',
                    {
                        ascending: true
                    }
                );


        if (error) {

            throw error;

        }


        products =
            Array.isArray(data)
                ? data
                : [];


        usingLocalStorage =
            false;


        setConnectionStatus(
            true,
            false
        );


        saveLocalProducts();


        renderTable(
            products
        );


        console.log(
            'PRODUCTS LOADED:',
            products
        );


    }

    catch (error) {

        console.error(
            'Supabase load error:',
            error
        );


        let localData = [];


        try {

            const stored =
                localStorage.getItem(
                    'local_products'
                );


            localData =
                stored
                    ? JSON.parse(stored)
                    : [];

        }

        catch {

            localData = [];

        }


        products =
            Array.isArray(localData)
                ? localData
                : [];


        usingLocalStorage =
            true;


        setConnectionStatus(
            false,
            true
        );


        renderTable(
            products
        );


        showStatus(
            'Supabase gagal mengambil data. Mode Local Storage digunakan. ' +
            getErrorMessage(error),
            'warning'
        );

    }

}


// =========================================================
// RENDER TABLE
// =========================================================

function renderTable(dataList) {

    const tbody =
        $('prodTable');


    if (!tbody) {
        return;
    }


    const list =
        Array.isArray(dataList)
            ? dataList
            : [];


    $('productCount').textContent =
        `${list.length} produk ditampilkan`;


    if (list.length === 0) {

        tbody.innerHTML = `
            <tr>
                <td
                    colspan="7"
                    class="text-center py-12"
                >

                    <div class="flex flex-col items-center">

                        <div class="w-12 h-12 rounded-full bg-slate-100 flex items-center justify-center mb-3">

                            <i class="fa-solid fa-box-open text-slate-400"></i>

                        </div>

                        <p class="text-xs font-semibold text-slate-500">
                            Belum ada produk
                        </p>

                        <p class="text-[10px] text-slate-400 mt-1">
                            Tambahkan produk menggunakan form di atas.
                        </p>

                    </div>

                </td>
            </tr>
        `;

        return;

    }


    tbody.innerHTML =
        list.map(
            product => {

                const id =
                    product?.id ?? '';


                const name =
                    getProductName(product) ||
                    '-';


                const category =
                    getProductCategory(product) ||
                    '-';


                const price =
                    getProductPrice(product);


                const hpp =
                    getProductHpp(product);


                const stock =
                    getProductStock(product);


                const image =
                    getProductImage(product);


                const imageSrc =
                    validImageUrl(image)
                        ? image
                        : fallbackImage();


                let stockClass =
                    'text-emerald-600';


                if (stock <= 0) {

                    stockClass =
                        'text-red-600';

                }

                else if (stock <= 5) {

                    stockClass =
                        'text-amber-600';

                }


                return `

                    <tr class="hover:bg-slate-50 transition">

                        <!-- FOTO -->

                        <td class="p-3">

                            <img
                                src="${escapeHtml(imageSrc)}"
                                alt="${escapeHtml(name)}"
                                loading="lazy"
                                class="w-12 h-12 object-cover rounded-xl shadow-sm border border-slate-100"
                                onerror="this.onerror=null;this.src='${fallbackImage()}'"
                            >

                        </td>


                        <!-- NAMA -->

                        <td class="p-3">

                            <div class="font-semibold text-slate-800">
                                ${escapeHtml(name)}
                            </div>


                            ${
                                getProductDescription(product)
                                    ? `
                                        <div class="text-[10px] text-slate-400 mt-1 max-w-xs truncate">
                                            ${escapeHtml(
                                                getProductDescription(product)
                                            )}
                                        </div>
                                    `
                                    : ''
                            }

                        </td>


                        <!-- KATEGORI -->

                        <td class="p-3">

                            <span class="bg-slate-100 text-slate-600 px-2 py-1 rounded-lg text-[10px] font-medium">

                                ${escapeHtml(category)}

                            </span>

                        </td>


                        <!-- HARGA -->

                        <td class="p-3 font-bold text-orange-600">

                            ${rupiah(price)}

                        </td>


                        <!-- HPP -->

                        <td class="p-3 text-slate-600">

                            ${rupiah(hpp)}

                        </td>


                        <!-- STOK -->

                        <td class="p-3 font-bold ${stockClass}">

                            ${stock}

                        </td>


                        <!-- ACTION -->

                        <td class="p-3">

                            <div class="flex gap-1">

                                <button
                                    type="button"
                                    data-action="edit"
                                    data-id="${escapeHtml(id)}"
                                    class="bg-sky-50 text-sky-600 hover:bg-sky-100 p-2 rounded-lg transition"
                                    title="Edit"
                                >

                                    <i class="fa-solid fa-pen"></i>

                                </button>


                                <button
                                    type="button"
                                    data-action="delete"
                                    data-id="${escapeHtml(id)}"
                                    class="bg-rose-50 text-rose-600 hover:bg-rose-100 p-2 rounded-lg transition"
                                    title="Hapus"
                                >

                                    <i class="fa-solid fa-trash"></i>

                                </button>

                            </div>

                        </td>

                    </tr>

                `;

            }
        ).join('');

}


// =========================================================
// FILTER
// =========================================================

function filterTable() {

    const keyword =
        $('p-search')
            .value
            .toLowerCase()
            .trim();


    if (!keyword) {

        renderTable(
            products
        );

        return;

    }


    const filtered =
        products.filter(
            product => {

                const name =
                    getProductName(product)
                        .toLowerCase();


                const category =
                    getProductCategory(product)
                        .toLowerCase();


                const description =
                    getProductDescription(product)
                        .toLowerCase();


                return (
                    name.includes(keyword) ||
                    category.includes(keyword) ||
                    description.includes(keyword)
                );

            }
        );


    renderTable(
        filtered
    );

}


// =========================================================
// FORM DATA
// =========================================================

function getFormData() {

    const nama =
        $('p-nama')
            .value
            .trim();


    const kategori =
        $('p-kategori')
            .value
            .trim()
            .toLowerCase();


    const hargaRaw =
        $('p-harga')
            .value
            .trim();


    const hppRaw =
        $('p-hpp')
            .value
            .trim();


    const stokRaw =
        $('p-stok')
            .value
            .trim();


    const foto =
        $('p-foto')
            .value
            .trim();


    const deskripsi =
        $('p-deskripsi')
            .value
            .trim();


    const harga =
        Number(hargaRaw);


    const hpp =
        hppRaw === ''
            ? 0
            : Number(hppRaw);


    const stok =
        stokRaw === ''
            ? 0
            : Number(stokRaw);


    if (!nama) {

        throw new Error(
            'Nama produk wajib diisi.'
        );

    }


    if (
        !Number.isFinite(harga) ||
        harga <= 0
    ) {

        throw new Error(
            'Harga jual harus lebih besar dari 0.'
        );

    }


    if (
        !Number.isFinite(hpp) ||
        hpp < 0
    ) {

        throw new Error(
            'HPP tidak boleh negatif.'
        );

    }


    if (
        !Number.isFinite(stok) ||
        stok < 0 ||
        !Number.isInteger(stok)
    ) {

        throw new Error(
            'Stok harus berupa angka bulat 0 atau lebih.'
        );

    }


    if (
        foto &&
        !validImageUrl(foto)
    ) {

        throw new Error(
            'URL foto tidak valid.'
        );

    }


    return {
        nama,
        kategori,
        harga,
        hpp,
        stok,
        foto,
        deskripsi
    };

}


// =========================================================
// RESET FORM
// =========================================================

function resetForm() {

    $('p-id').value = '';

    $('p-nama').value = '';

    $('p-kategori').value = '';

    $('p-harga').value = '';

    $('p-hpp').value = '';

    $('p-stok').value = '';

    $('p-foto').value = '';

    $('p-deskripsi').value = '';


    $('btnCancelEdit')
        .classList
        .add('hidden');


    $('formTitle').innerHTML =
        '<i class="fa-solid fa-plus-circle text-orange-500"></i> Tambah Produk';


    $('btnSaveText').textContent =
        'Simpan Produk';


    hidePhotoPreview();

}


// =========================================================
// EDIT PRODUCT
// =========================================================

function editProduct(id) {

    console.log(
        'EDIT PRODUCT ID:',
        id
    );


    const product =
        products.find(
            item =>
                String(item?.id) ===
                String(id)
        );


    if (!product) {

        showStatus(
            'Produk tidak ditemukan di data aplikasi.',
            'error'
        );

        return;

    }


    console.log(
        'PRODUCT YANG DIEDIT:',
        product
    );


    $('p-id').value =
        product.id ?? '';


    $('p-nama').value =
        getProductName(product);


    $('p-kategori').value =
        getProductCategory(product);


    $('p-harga').value =
        getProductPrice(product) || '';


    $('p-hpp').value =
        getProductHpp(product) || '';


    $('p-stok').value =
        getProductStock(product);


    $('p-foto').value =
        getProductImage(product);


    $('p-deskripsi').value =
        getProductDescription(product);


    $('btnCancelEdit')
        .classList
        .remove('hidden');


    $('formTitle').innerHTML =
        '<i class="fa-solid fa-pen-to-square text-sky-500"></i> Edit Produk';


    $('btnSaveText').textContent =
        'Update Produk';


    updatePhotoPreview();


    window.scrollTo({
        top: 0,
        behavior: 'smooth'
    });


    setTimeout(
        () => {
            $('p-nama').focus();
        },
        200
    );

}


// =========================================================
// PHOTO PREVIEW
// =========================================================

function hidePhotoPreview() {

    $('photoPreview')
        .classList
        .add('hidden');


    $('previewImage').src = '';

}


function updatePhotoPreview() {

    const url =
        $('p-foto')
            .value
            .trim();


    if (
        !url ||
        !validImageUrl(url)
    ) {

        hidePhotoPreview();

        return;

    }


    const image =
        $('previewImage');


    image.onerror = () => {

        hidePhotoPreview();

    };


    image.onload = () => {

        $('photoPreview')
            .classList
            .remove('hidden');

    };


    image.src = url;

}


// =========================================================
// SAVE PRODUCT
// =========================================================

async function saveProduct() {

    if (isSaving) {
        return;
    }


    isSaving = true;


    const button =
        $('btnSave');


    const buttonText =
        $('btnSaveText');


    button.disabled = true;

    buttonText.textContent =
        'Menyimpan...';


    try {

        const id =
            $('p-id')
                .value
                .trim();


        const payload =
            getFormData();


        console.log(
            '================================'
        );

        console.log(
            'SAVE PRODUCT'
        );

        console.log(
            'ID:',
            id
        );

        console.log(
            'PAYLOAD:',
            payload
        );

        console.log(
            'LOCAL MODE:',
            usingLocalStorage
        );

        console.log(
            '================================'
        );


        // =====================================================
        // LOCAL STORAGE
        // =====================================================

        if (usingLocalStorage) {

            if (id) {

                const index =
                    products.findIndex(
                        item =>
                            String(item.id) ===
                            String(id)
                    );


                if (index === -1) {

                    throw new Error(
                        'Produk tidak ditemukan di Local Storage.'
                    );

                }


                products[index] = {
                    ...products[index],
                    ...payload
                };


                showStatus(
                    'Produk berhasil diperbarui di Local Storage.',
                    'success'
                );

            }

            else {

                const newId =
                    (
                        typeof crypto !== 'undefined' &&
                        crypto.randomUUID
                    )
                        ? crypto.randomUUID()
                        : String(Date.now());


                products.unshift({
                    id: newId,
                    ...payload,
                    created_at:
                        new Date().toISOString()
                });


                showStatus(
                    'Produk berhasil ditambahkan ke Local Storage.',
                    'success'
                );

            }


            saveLocalProducts();

            renderTable(products);

            resetForm();

            return;

        }


        // =====================================================
        // CHECK SESSION
        // =====================================================

        const session =
            await checkAuth();


        console.log(
            'SESSION SAAT SAVE:',
            session
        );


        /*
         * Session tidak dipaksa ada di sini.
         * Supabase sendiri akan menentukan apakah
         * RLS mengizinkan operasi.
         */


        // =====================================================
        // UPDATE
        // =====================================================

        if (id) {

            console.log(
                'UPDATE ID:',
                id
            );


            /*
             * .select() sangat penting.
             *
             * Kita meminta Supabase mengembalikan row
             * yang benar-benar terkena UPDATE.
             */

            const {
                data: updatedRows,
                error: updateError
            } =
                await supabase
                    .from('products')
                    .update(payload)
                    .eq('id', id)
                    .select('*');


            console.log(
                'UPDATE RESPONSE:',
                {
                    updatedRows,
                    updateError
                }
            );


            if (updateError) {

                throw updateError;

            }


            /*
             * Jika array kosong, query tidak menemukan
             * row yang bisa di-update.
             */

            if (
                !Array.isArray(updatedRows) ||
                updatedRows.length === 0
            ) {

                throw new Error(
                    'UPDATE tidak mengubah row apa pun. ' +
                    'ID produk tidak ditemukan atau RLS policy ' +
                    'tidak mengizinkan row tersebut di-update.'
                );

            }


            const updatedProduct =
                updatedRows[0];


            console.log(
                'ROW SETELAH UPDATE:',
                updatedProduct
            );


            // =================================================
            // VERIFIKASI ULANG DARI DATABASE
            // =================================================

            const {
                data: verifiedProduct,
                error: verifyError
            } =
                await supabase
                    .from('products')
                    .select('*')
                    .eq('id', id)
                    .maybeSingle();


            console.log(
                'DATABASE VERIFICATION:',
                {
                    verifiedProduct,
                    verifyError
                }
            );


            if (verifyError) {

                throw verifyError;

            }


            if (!verifiedProduct) {

                throw new Error(
                    'UPDATE diklaim berhasil tetapi row tidak ditemukan ' +
                    saat ' +
                    'verifikasi ulang database.'
                );

            }


            /*
             * Pastikan nilai utama benar-benar sama dengan
             * payload yang dikirim.
             */

            const verificationProblems = [];


            if (
                String(verifiedProduct.nama ?? '') !==
                String(payload.nama ?? '')
            ) {

                verificationProblems.push(
                    'nama'
                );

            }


            if (
                Number(verifiedProduct.harga ?? 0) !==
                Number(payload.harga ?? 0)
            ) {

                verificationProblems.push(
                    'harga'
                );

            }


            if (
                Number(verifiedProduct.hpp ?? 0) !==
                Number(payload.hpp ?? 0)
            ) {

                verificationProblems.push(
                    'hpp'
                );

            }


            if (
                Number(verifiedProduct.stok ?? 0) !==
                Number(payload.stok ?? 0)
            ) {

                verificationProblems.push(
                    'stok'
                );

            }


            if (
                String(verifiedProduct.kategori ?? '') !==
                String(payload.kategori ?? '')
            ) {

                verificationProblems.push(
                    'kategori'
                );

            }


            if (
                String(verifiedProduct.foto ?? '') !==
                String(payload.foto ?? '')
            ) {

                verificationProblems.push(
                    'foto'
                );

            }


            if (
                String(verifiedProduct.deskripsi ?? '') !==
                String(payload.deskripsi ?? '')
            ) {

                verificationProblems.push(
                    'deskripsi'
                );

            }


            if (
                verificationProblems.length > 0
            ) {

                console.error(
                    'VERIFICATION FAILED:',
                    verificationProblems
                );


                throw new Error(
                    'Database tidak menyimpan nilai yang dikirim. ' +
                    'Kolom bermasalah: ' +
                    verificationProblems.join(', ')
                );

            }


            showStatus(
                'Produk berhasil diperbarui dan diverifikasi langsung dari database Supabase.',
                'success'
            );


            resetForm();


            /*
             * Ambil ulang data dari Supabase.
             */

            await loadProducts();


            return;

        }


        // =====================================================
        // INSERT
        // =====================================================

        const {
            data: insertedRows,
            error: insertError
        } =
            await supabase
                .from('products')
                .insert([payload])
                .select('*');


        console.log(
            'INSERT RESPONSE:',
            {
                insertedRows,
                insertError
            }
        );


        if (insertError) {

            throw insertError;

        }


        if (
            !Array.isArray(insertedRows) ||
            insertedRows.length === 0
        ) {

            throw new Error(
                'INSERT tidak menghasilkan row baru.'
            );

        }


        const insertedProduct =
            insertedRows[0];


        console.log(
            'INSERTED PRODUCT:',
            insertedProduct
        );


        showStatus(
            'Produk baru berhasil disimpan dan diverifikasi di Supabase.',
            'success'
        );


        resetForm();


        await loadProducts();

    }


    catch (error) {

        console.error(
            '================================'
        );

        console.error(
            'SAVE PRODUCT ERROR:',
            error
        );

        console.error(
            '================================'
        );


        showStatus(
            formatSupabaseError(error),
            'error'
        );

    }


    finally {

        isSaving = false;

        button.disabled = false;


        buttonText.textContent =
            $('p-id').value.trim()
                ? 'Update Produk'
                : 'Simpan Produk';

    }

}


// =========================================================
// DELETE PRODUCT
// =========================================================

async function deleteProduct(id) {

    if (isDeleting) {
        return;
    }


    const product =
        products.find(
            item =>
                String(item?.id) ===
                String(id)
        );


    const productName =
        product
            ? getProductName(product)
            : 'produk ini';


    const confirmed =
        confirm(
            `Hapus "${productName}"?\n\nData yang sudah dihapus tidak dapat dikembalikan.`
        );


    if (!confirmed) {
        return;
    }


    isDeleting = true;


    try {

        console.log(
            'DELETE PRODUCT ID:',
            id
        );


        // =====================================================
        // LOCAL
        // =====================================================

        if (usingLocalStorage) {

            const before =
                products.length;


            products =
                products.filter(
                    item =>
                        String(item.id) !==
                        String(id)
                );


            if (
                products.length === before
            ) {

                throw new Error(
                    'Produk tidak ditemukan.'
                );

            }


            saveLocalProducts();

            renderTable(products);


            showStatus(
                'Produk berhasil dihapus dari Local Storage.',
                'success'
            );


            return;

        }


        // =====================================================
        // SUPABASE DELETE
        // =====================================================

        const {
            data: deletedRows,
            error: deleteError
        } =
            await supabase
                .from('products')
                .delete()
                .eq('id', id)
                .select('*');


        console.log(
            'DELETE RESPONSE:',
            {
                deletedRows,
                deleteError
            }
        );


        if (deleteError) {

            throw deleteError;

        }


        if (
            !Array.isArray(deletedRows) ||
            deletedRows.length === 0
        ) {

            throw new Error(
                'DELETE tidak menghapus row apa pun. ' +
                'ID tidak ditemukan atau RLS policy menolak operasi.'
            );

        }


        // =====================================================
        // VERIFY DELETE
        // =====================================================

        const {
            data: remainingProduct,
            error: verifyError
        } =
            await supabase
                .from('products')
                .select('id')
                .eq('id', id)
                .maybeSingle();


        if (verifyError) {

            throw verifyError;

        }


        if (remainingProduct) {

            throw new Error(
                'Produk masih ditemukan di database setelah DELETE.'
            );

        }


        showStatus(
            'Produk berhasil dihapus dan diverifikasi dari Supabase.',
            'success'
        );


        await loadProducts();

    }


    catch (error) {

        console.error(
            'DELETE PRODUCT ERROR:',
            error
        );


        showStatus(
            formatSupabaseError(error),
            'error'
        );

    }


    finally {

        isDeleting = false;

    }

}


// =========================================================
// ERROR FORMATTER
// =========================================================

function getErrorMessage(error) {

    if (!error) {

        return 'Unknown error';

    }


    return (
        error.message ||
        error.error_description ||
        error.details ||
        error.hint ||
        String(error)
    );

}


function formatSupabaseError(error) {

    const message =
        getErrorMessage(error);


    const lower =
        message.toLowerCase();


    if (
        lower.includes(
            'row-level security'
        ) ||
        lower.includes(
            'permission denied'
        ) ||
        lower.includes(
            'rls'
        )
    ) {

        return (
            'Supabase menolak operasi karena RLS. ' +
            'Periksa policy SELECT, INSERT, UPDATE, dan DELETE pada tabel products.'
        );

    }


    if (
        lower.includes('jwt') ||
        lower.includes('invalid token') ||
        lower.includes('token is expired')
    ) {

        return (
            'Session Supabase tidak valid atau sudah expired. ' +
            'Silakan login kembali.'
        );

    }


    if (
        lower.includes('duplicate') ||
        lower.includes('unique')
    ) {

        return (
            'Data duplikat. Nilai yang harus unik sudah digunakan.'
        );

    }


    if (
        lower.includes('column') &&
        lower.includes('does not exist')
    ) {

        return (
            'Kolom database tidak ditemukan. ' +
            'Pastikan nama kolom products sesuai dengan kode.'
        );

    }


    if (
        lower.includes('relation') &&
        lower.includes('does not exist')
    ) {

        return (
            'Tabel products tidak ditemukan di Supabase.'
        );

    }


    return (
        'Operasi database gagal: ' +
        message
    );

}

// EVENTS
// =========================================================

$('btnSave')
    .addEventListener(
        'click',
        saveProduct
    );


$('btnCancelEdit')
    .addEventListener(
        'click',
        resetForm
    );


$('btnRefresh')
    .addEventListener(
        'click',
        async () => {

            hideStatus();

            await loadProducts();

        }
    );


$('p-search')
    .addEventListener(
        'input',
        filterTable
    );


$('p-foto')
    .addEventListener(
        'input',
        updatePhotoPreview
    );


/*
 * EVENT DELEGATION
 */

$('prodTable')
    .addEventListener(
        'click',
        event => {

            const button =
                event.target.closest(
                    'button[data-action]'
                );


            if (!button) {
                return;
            }


            const action =
                button.dataset.action;


            const id =
                button.dataset.id;


            if (!id) {

                showStatus(
                    'ID produk kosong. Periksa kolom id di database.',
                    'error'
                );

                return;

            }


            if (
                action === 'edit'
            ) {

                editProduct(id);

            }


            if (
                action === 'delete'
            ) {

                deleteProduct(id);

            }

        }
    );


// =========================================================
// INITIALIZE
// =========================================================

(async function init() {

    try {

        await authReady;

        await checkAuth();

        await loadProducts();

    }

    catch (error) {

        console.error(
            'INITIALIZATION ERROR:',
            error
        );


        showStatus(
            getErrorMessage(error),
            'error'
        );

    }

})();
