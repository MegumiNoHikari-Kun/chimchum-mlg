<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kelola Produk - ChimChum</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }

        input,
        textarea,
        button {
            font-family: inherit;
        }

        .loading-spinner {
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body class="bg-white p-4 sm:p-6 overflow-y-auto">

<div class="max-w-6xl mx-auto">

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <div class="flex flex-col lg:flex-row lg:justify-between lg:items-center gap-4 mb-6 border-b pb-4">

        <div>

            <h3
                id="formTitle"
                class="font-bold text-base text-slate-800 flex items-center gap-2"
            >
                <i class="fa-solid fa-plus-circle text-orange-500"></i>
                Tambah Produk
            </h3>

            <p class="text-xs text-slate-500 mt-1">
                Kelola katalog menu makanan & minuman ChimChum.
            </p>

        </div>


        

    </div>


    <!-- =====================================================
         STATUS
    ====================================================== -->

    <div
        id="statusBox"
        class="hidden mb-5 rounded-xl px-4 py-3 text-xs"
    ></div>


    <!-- =====================================================
         FORM PRODUK
    ====================================================== -->

    <div class="bg-slate-50 border border-slate-100 rounded-2xl p-4 sm:p-5 mb-6 shadow-sm">

        <input
            type="hidden"
            id="p-id"
        >


        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 mb-3">

            <!-- NAMA -->

            <div>

                <label class="block text-[11px] font-medium text-slate-600 mb-1">
                    Nama Produk
                    <span class="text-red-500">*</span>
                </label>

                <input
                    id="p-nama"
                    type="text"
                    maxlength="150"
                    placeholder="Contoh: Dimsum Ayam"
                    class="bg-white border border-slate-200 rounded-xl p-2.5 text-xs outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-100 w-full transition"
                >

            </div>


            <!-- KATEGORI -->

            <div>

                <label class="block text-[11px] font-medium text-slate-600 mb-1">
                    Kategori
                </label>

                <input
                    id="p-kategori"
                    type="text"
                    maxlength="80"
                    placeholder="Contoh: dimsum"
                    class="bg-white border border-slate-200 rounded-xl p-2.5 text-xs outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-100 w-full transition"
                >

            </div>


            <!-- HARGA -->

            <div>

                <label class="block text-[11px] font-medium text-slate-600 mb-1">
                    Harga Jual (Rp)
                    <span class="text-red-500">*</span>
                </label>

                <input
                    type="number"
                    id="p-harga"
                    min="1"
                    step="1"
                    placeholder="25000"
                    class="bg-white border border-slate-200 rounded-xl p-2.5 text-xs outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-100 w-full transition"
                >

            </div>


            <!-- HPP -->

            <div>

                <label class="block text-[11px] font-medium text-slate-600 mb-1">
                    HPP (Rp)
                </label>

                <input
                    type="number"
                    id="p-hpp"
                    min="0"
                    step="1"
                    placeholder="10000"
                    class="bg-white border border-slate-200 rounded-xl p-2.5 text-xs outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-100 w-full transition"
                >

            </div>


            <!-- STOK -->

            <div>

                <label class="block text-[11px] font-medium text-slate-600 mb-1">
                    Stok Porsi
                </label>

                <input
                    type="number"
                    id="p-stok"
                    min="0"
                    step="1"
                    placeholder="30"
                    class="bg-white border border-slate-200 rounded-xl p-2.5 text-xs outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-100 w-full transition"
                >

            </div>


            <!-- FOTO -->

            <div>

                <label class="block text-[11px] font-medium text-slate-600 mb-1">
                    URL Foto Produk
                </label>

                <input
                    id="p-foto"
                    type="url"
                    maxlength="1000"
                    placeholder="https://..."
                    class="bg-white border border-slate-200 rounded-xl p-2.5 text-xs outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-100 w-full transition"
                >

            </div>

        </div>


        <!-- DESKRIPSI -->

        <div class="mb-3">

            <label class="block text-[11px] font-medium text-slate-600 mb-1">
                Deskripsi
            </label>

            <textarea
                id="p-deskripsi"
                maxlength="500"
                placeholder="Deskripsi produk singkat..."
                rows="3"
                class="w-full bg-white border border-slate-200 rounded-xl p-2.5 text-xs outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-100 transition resize-none"
            ></textarea>

        </div>


        <!-- PREVIEW FOTO -->

        <div
            id="photoPreview"
            class="hidden mb-4 bg-white border border-slate-200 rounded-xl p-3"
        >

            <div class="flex items-center gap-3">

                <img
                    id="previewImage"
                    src=""
                    alt="Preview produk"
                    class="w-16 h-16 rounded-xl object-cover border border-slate-200"
                >

                <div>

                    <p class="text-xs font-semibold text-slate-700">
                        Preview Foto
                    </p>

                    <p class="text-[10px] text-slate-400 mt-1">
                        Preview gambar produk.
                    </p>

                </div>

            </div>

        </div>


        <!-- BUTTON -->

        <div class="flex flex-wrap gap-2">

            <button
                id="btnSave"
                type="button"
                class="bg-orange-500 hover:bg-orange-600 disabled:bg-orange-300 disabled:cursor-not-allowed text-white font-semibold px-5 py-2.5 rounded-xl text-xs transition shadow-sm"
            >

                <i class="fa-solid fa-save mr-1"></i>

                <span id="btnSaveText">
                    Simpan Produk
                </span>

            </button>


            <button
                id="btnCancelEdit"
                type="button"
                class="hidden bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold px-4 py-2.5 rounded-xl text-xs transition"
            >

                <i class="fa-solid fa-xmark mr-1"></i>

                Batal Edit

            </button>


            <button
                id="btnRefresh"
                type="button"
                class="bg-white border border-slate-200 hover:bg-slate-100 text-slate-600 font-semibold px-4 py-2.5 rounded-xl text-xs transition"
            >

                <i class="fa-solid fa-rotate mr-1"></i>

                Refresh

            </button>

        </div>

    </div>


    <!-- =====================================================
         TABLE HEADER
    ====================================================== -->

    <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-3 mb-3">

        <div>
            <h4 class="font-bold text-sm text-slate-800">
                Daftar Produk
            </h4>
            <p
                id="productCount"
                class="text-[10px] text-slate-400 mt-0.5"
            >
                Memuat...
            </p>
        </div>
    
        <div class="flex items-center gap-3 w-full sm:w-auto">
            <!-- SEARCH BAR DENGAN TOMBOL CLEAR -->
            <div class="relative w-full sm:w-80">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                
                <input
                    type="text"
                    id="p-search"
                    placeholder="Cari nama produk atau kategori..."
                    autocomplete="off"
                    class="bg-slate-50 border border-slate-200 rounded-xl pl-9 pr-9 py-2 text-xs outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-100 w-full transition"
                >
    
                <!-- TOMBOL X UNTUK BERSIHKAN PENCARIAN -->
                <button
                    type="button"
                    id="btnClearProductSearch"
                    class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 text-xs p-1"
                    title="Bersihkan pencarian"
                >
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
    
            <div
                id="connectionStatus"
                class="text-[10px] text-slate-400 whitespace-nowrap hidden sm:block"
            >
                <i class="fa-solid fa-circle-notch loading-spinner mr-1"></i>
                Menghubungkan...
            </div>
        </div>
    
    </div>


    <!-- =====================================================
         TABLE
    ====================================================== -->

    <div class="overflow-x-auto border border-slate-100 rounded-2xl shadow-sm">

        <table class="w-full text-left border-collapse text-xs">

            <thead>

                <tr class="bg-orange-50 text-slate-700 font-semibold">

                    <th class="p-3.5 min-w-[70px]">
                        Foto
                    </th>

                    <th class="p-3.5 min-w-[180px]">
                        Nama
                    </th>

                    <th class="p-3.5 min-w-[110px]">
                        Kategori
                    </th>

                    <th class="p-3.5 min-w-[120px]">
                        Harga Jual
                    </th>

                    <th class="p-3.5 min-w-[120px]">
                        HPP
                    </th>

                    <th class="p-3.5 min-w-[80px]">
                        Stok
                    </th>

                    <th class="p-3.5 min-w-[100px]">
                        Aksi
                    </th>

                </tr>

            </thead>


            <tbody
                id="prodTable"
                class="divide-y divide-slate-100"
            >

                <tr>

                    <td
                        colspan="7"
                        class="text-center py-10 text-slate-400"
                    >

                        <i class="fa-solid fa-circle-notch loading-spinner text-orange-500 mr-2"></i>

                        Memuat produk...

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>

<script type="module">
    import { requireAuth } from './js/module/auth-guard.js';

    const auth = await requireAuth(['admin']);

    if (auth) {
        await import('./js/module/produk.js');
    }
</script>

</body>
</html>
