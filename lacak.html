<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lacak Pesanan - ChimChum Malang</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fff5f0',
                            100: '#ffedd5',
                            500: '#ff6b35',
                            600: '#ea580c',
                            700: '#c2410c',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- Supabase JS Client via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-[#fff5f0] text-slate-800 min-h-screen flex flex-col justify-between">

    <nav class="bg-white sticky top-0 z-40 shadow-sm border-b border-slate-100">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-12 h-12 rounded-2xl overflow-hidden shadow-md shadow-brand-500/25 bg-slate-100 flex items-center justify-center">
                    <img src="./assets/logo-transparan.jpg" alt="ChimChum Logo" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/50?text=CC'">
                </div>
                <div>
                    <h1 class="font-bold text-xl text-slate-900 tracking-tight">ChimChum <span class="text-brand-500">Malang</span></h1>
                    <p class="text-xs text-slate-500 font-medium">Lacak Status Pesanan</p>
                </div>
            </div>

            <div class="flex items-center space-x-3">
                <a href="index.html" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2.5 rounded-xl font-semibold text-sm flex items-center space-x-2 transition">
                    <i class="fa-solid fa-house"></i>
                    <span class="hidden sm:inline">Beranda</span>
                </a>
            </div>
        </div>
    </nav>

    <main class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 flex-grow w-full my-12">
        <div class="bg-white rounded-3xl p-6 sm:p-10 shadow-sm border border-slate-100">
            <div class="text-center max-w-lg mx-auto mb-8">
                <div class="w-16 h-16 bg-brand-50 text-brand-500 rounded-2xl flex items-center justify-center text-2xl mx-auto mb-4 shadow-sm">
                    <i class="fa-solid fa-receipt"></i>
                </div>
                <h2 class="text-2xl font-bold text-slate-900 tracking-tight mb-2">Lacak Status Pesanan Anda</h2>
                <p class="text-slate-500 text-sm">Masukkan ID pesanan Anda atau akses langsung melalui tautan URL.</p>
            </div>

            <div class="space-y-4">
                <div class="flex flex-col sm:flex-row gap-2">
                    <input type="text" id="tracker-order-id" placeholder="Masukkan ID Pesanan (cth: ORD-1234)" class="flex-grow px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
                    <button onclick="fetchOrderStatus()" class="bg-brand-500 hover:bg-brand-600 text-white px-6 py-3 rounded-xl font-semibold text-sm transition shadow-md shadow-brand-500/25 flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <span>Cek Status</span>
                    </button>
                </div>
                
                <div id="tracker-result" class="hidden pt-6 border-t border-slate-100 space-y-4">
                    <!-- Dynamic Result Rendered Here -->
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-white border-t border-slate-200 py-8 text-center text-slate-500 text-sm">
        <div class="max-w-7xl mx-auto px-4">
            <p>&copy; 2026 ChimChum Malang. All rights reserved. Seamless Supabase Integration.</p>
        </div>
    </footer>

    <script type="module">
        import { supabase, authReady } from './js/supabase.js';

        // Extract Order ID automatically from URL path or query parameter
        // Supports formats: /lacak.html/ORD-1234, /lacak/ORD-1234, or ?id=ORD-1234
        function extractOrderIdFromURL() {
            const pathname = window.location.pathname;
            const segments = pathname.split('/').filter(Boolean);
            
            // Check if last segment looks like an order ID (e.g. ORD-... or KSR-...)
            const lastSegment = segments[segments.length - 1];
            if (lastSegment && (lastSegment.startsWith('ORD-') || lastSegment.startsWith('KSR-'))) {
                return decodeURIComponent(lastSegment);
            }

            // Check query parameters (?id=ORD-1234 or ?order=ORD-1234)
            const urlParams = new URLSearchParams(window.location.search);
            const idParam = urlParams.get('id') || urlParams.get('order') || urlParams.get('order_id');
            if (idParam) {
                return idParam.trim();
            }

            return null;
        }

        window.fetchOrderStatus = async function(manualId = null) {
            const orderIdInput = manualId || document.getElementById('tracker-order-id').value.trim();
            const resultDiv = document.getElementById('tracker-result');
            
            if (!orderIdInput) {
                if (!manualId) {
                    alert('Masukkan ID pesanan terlebih dahulu.');
                }
                return;
            }

            document.getElementById('tracker-order-id').value = orderIdInput;

            let foundOrder = null;
            try {
                await authReady;
                const { data } = await supabase.from('orders').select('*').eq('order_id', orderIdInput).maybeSingle();
                if (data) foundOrder = data;
            } catch (e) {
                console.error('Supabase fetch error:', e);
            }

            if (!foundOrder) {
                let localOrders = JSON.parse(localStorage.getItem('local_orders') || '[]');
                foundOrder = localOrders.find(o => o.order_id === orderIdInput);
            }

            resultDiv.classList.remove('hidden');
            if (foundOrder) {
                let proofDisplay = '';
                if (foundOrder.payment_proof && foundOrder.payment_proof !== 'Pending / Cash') {
                    if (foundOrder.payment_proof.startsWith('data:image')) {
                        proofDisplay = `<div class="pt-2"><p class="text-xs text-slate-500 mb-1 font-semibold">Bukti Pembayaran:</p><img src="${foundOrder.payment_proof}" class="w-32 h-32 object-cover rounded-xl border border-slate-200"></div>`;
                    } else {
                        proofDisplay = `<div class="pt-2"><a href="${foundOrder.payment_proof}" target="_blank" class="text-xs text-brand-600 underline font-semibold">Lihat Bukti Pembayaran ↗</a></div>`;
                    }
                }

                const itemsList = Array.isArray(foundOrder.items) 
                    ? foundOrder.items.map(i => `<div class="flex justify-between text-xs py-1 border-b border-slate-100 last:border-none"><span>${i.nama || i.name} (${i.qty}x)</span><span class="font-medium">Rp ${((i.price || i.harga) * i.qty).toLocaleString('id-ID')}</span></div>`).join('')
                    : '-';

                const orderTime = foundOrder.created_at ? new Date(foundOrder.created_at).toLocaleString('id-ID', { timeZone: 'Asia/Jakarta' }) : '-';

                resultDiv.innerHTML = `
                    <div class="bg-slate-50 p-5 rounded-2xl space-y-3 text-sm border border-slate-100">
                        <div class="flex justify-between items-center pb-2 border-b border-slate-200">
                            <span class="text-slate-500 text-xs">ID Pesanan:</span>
                            <span class="font-bold text-slate-900">${foundOrder.order_id}</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-slate-500 text-xs">Waktu Pemesanan (WIB):</span>
                            <span class="font-medium text-slate-800 text-xs">${orderTime}</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-slate-500 text-xs">Nama Pemesan:</span>
                            <span class="font-semibold text-slate-800">${foundOrder.customer_name}</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-slate-500 text-xs">No. WhatsApp:</span>
                            <span class="font-medium text-slate-800">${foundOrder.phone}</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-slate-500 text-xs">Metode Pembayaran:</span>
                            <span class="font-medium text-slate-800">${foundOrder.payment_method || 'Cash'}</span>
                        </div>
                        <div class="flex justify-between items-center pb-2 border-b border-slate-200">
                            <span class="text-slate-500 text-xs">Status Pesanan:</span>
                            <span class="bg-amber-100 text-amber-700 text-xs px-3 py-1 rounded-full font-bold uppercase">${foundOrder.status}</span>
                        </div>
                        <div class="pt-1">
                            <p class="text-xs text-slate-500 font-semibold mb-1">Rincian Item:</p>
                            <div class="bg-white p-3 rounded-xl border border-slate-200 space-y-1">
                                ${itemsList}
                            </div>
                        </div>
                        <div class="flex justify-between items-center pt-2 border-t border-slate-200 font-bold text-base">
                            <span class="text-slate-700">Total Harga:</span>
                            <span class="text-brand-600">Rp ${Number(foundOrder.grand_total || foundOrder.total_price || 0).toLocaleString('id-ID')}</span>
                        </div>
                        ${proofDisplay}
                    </div>
                `;
            } else {
                resultDiv.innerHTML = `
                    <div class="text-center py-8 text-slate-400 text-sm bg-slate-50 rounded-2xl border border-slate-100">
                        <i class="fa-solid fa-circle-exclamation text-2xl mb-2 text-amber-500"></i>
                        <p>Pesanan dengan ID <b>${orderIdInput}</b> tidak ditemukan.</p>
                        <p class="text-xs text-slate-400 mt-1">Pastikan ID yang diakses pada URL sudah benar.</p>
                    </div>
                `;
            }
        };

        // Auto-check order status on page load if ID is present in URL
        window.addEventListener('DOMContentLoaded', () => {
            const urlOrderId = extractOrderIdFromURL();
            if (urlOrderId) {
                fetchOrderStatus(urlOrderId);
            }
        });
    </script>
</body>
</html>
