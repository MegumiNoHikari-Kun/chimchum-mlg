<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lacak Pesanan - ChimChum Malang</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fff5f0',
                            100: '#ffedd5',
                            500: '#ff6b35',
                            600: '#ea580c',
                            700: '#c2410c',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- Supabase JS Client via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-[#fff5f0] text-slate-800 min-h-screen flex flex-col justify-between">

    <nav class="bg-white sticky top-0 z-40 shadow-sm border-b border-slate-100">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-12 h-12 rounded-2xl overflow-hidden shadow-md shadow-brand-500/25 bg-slate-100 flex items-center justify-center">
                    <img src="/assets/logo-transparan.jpg" alt="ChimChum Logo" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/50?text=CC'">
                </div>
                <div>
                    <h1 class="font-bold text-xl text-slate-900 tracking-tight">ChimChum <span class="text-brand-500">Malang</span></h1>
                    <p class="text-xs text-slate-500 font-medium">Lacak Status Pesanan</p>
                </div>
            </div>

            <div class="flex items-center space-x-3">
                <a href="/" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2.5 rounded-xl font-semibold text-sm flex items-center space-x-2 transition">
                    <i class="fa-solid fa-house"></i>
                    <span class="hidden sm:inline">Beranda</span>
                </a>
            </div>
        </div>
    </nav>

    <main class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 flex-grow w-full my-12">
        <div class="bg-white rounded-3xl p-6 sm:p-10 shadow-sm border border-slate-100">
            <div class="text-center max-w-lg mx-auto mb-8">
                <div class="w-16 h-16 bg-brand-50 text-brand-500 rounded-2xl flex items-center justify-center text-2xl mx-auto mb-4 shadow-sm">
                    <i class="fa-solid fa-receipt"></i>
                </div>
                <h2 class="text-2xl font-bold text-slate-900 tracking-tight mb-2">Lacak Status Pesanan Anda</h2>
                <p class="text-slate-500 text-sm">Masukkan ID pesanan Anda atau akses langsung melalui tautan URL.</p>
            </div>

            <div class="space-y-4">
                <div class="flex flex-col sm:flex-row gap-2">
                    <input type="text" id="tracker-order-id" placeholder="Masukkan ID Pesanan (cth: ORD-1234)" class="flex-grow px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
                    <button type="button" onclick="window.fetchOrderStatus()" class="bg-brand-500 hover:bg-brand-600 text-white px-6 py-3 rounded-xl font-semibold text-sm transition shadow-md shadow-brand-500/25 flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <span>Cek Status</span>
                    </button>
                </div>
                
                <div id="tracker-result" class="hidden pt-6 border-t border-slate-100 space-y-4">
                    <!-- Dynamic Result Rendered Here -->
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-white border-t border-slate-200 py-8 text-center text-slate-500 text-sm">
        <div class="max-w-7xl mx-auto px-4">
            <p>&copy; 2026 ChimChum Malang. All rights reserved. Seamless Supabase Integration.</p>
        </div>
    </footer>

    <!-- Define global functions immediately before module execution or attach them correctly -->
    <script>
        // Define global stub immediately so onclick never throws ReferenceError/TypeError
        window.fetchOrderStatus = function(manualId = null) {
            console.warn("fetchOrderStatus is still loading...");
        };
    </script>

    <script type="module">
        import { supabase, authReady } from '/js/supabase.js';
    
        // =========================================================
        // AMBIL ORDER ID DARI URL
        // Support:
        // /lacak.html/ORD-1692
        // /lacak.html?id=ORD-1692
        // /lacak.html?order=ORD-1692
        // /lacak.html?order_id=ORD-1692
        // =========================================================
        function extractOrderIdFromURL() {
            const pathname = window.location.pathname;
    
            // Decode URL dan pecah berdasarkan "/"
            const segments = pathname
                .split('/')
                .filter(Boolean)
                .map(segment => {
                    try {
                        return decodeURIComponent(segment);
                    } catch {
                        return segment;
                    }
                });
    
            // Cari segment ORD-xxxx atau KSR-xxxx
            for (let i = segments.length - 1; i >= 0; i--) {
                const seg = segments[i].trim();
    
                if (/^(ORD|KSR)-[A-Za-z0-9_-]+$/i.test(seg)) {
                    return seg.toUpperCase();
                }
            }
    
            // Support query parameter
            const params = new URLSearchParams(window.location.search);
    
            const idParam =
                params.get('id') ||
                params.get('order') ||
                params.get('order_id');
    
            if (idParam) {
                const normalized = idParam.trim().toUpperCase();
    
                if (/^(ORD|KSR)-[A-Za-z0-9_-]+$/i.test(normalized)) {
                    return normalized;
                }
            }
    
            return null;
        }
    
    
        // =========================================================
        // FORMAT RUPIAH
        // =========================================================
        function formatRupiah(value) {
            return Number(value || 0).toLocaleString('id-ID');
        }
    
    
        // =========================================================
        // FETCH ORDER
        // =========================================================
        window.fetchOrderStatus = async function(manualId = null) {
    
            const inputEl = document.getElementById('tracker-order-id');
            const resultDiv = document.getElementById('tracker-result');
    
            let orderIdInput = manualId;
    
            if (!orderIdInput && inputEl) {
                orderIdInput = inputEl.value.trim();
            }
    
            if (orderIdInput) {
                orderIdInput = orderIdInput.trim().toUpperCase();
            }
    
            // Tidak ada ID
            if (!orderIdInput) {
                if (resultDiv) {
                    resultDiv.classList.remove('hidden');
    
                    resultDiv.innerHTML = `
                        <div class="text-center py-6 text-amber-600 text-sm bg-amber-50 rounded-2xl border border-amber-200">
                            <i class="fa-solid fa-circle-exclamation text-xl mb-1"></i>
                            <p>Masukkan ID pesanan terlebih dahulu.</p>
                        </div>
                    `;
                }
    
                return;
            }
    
            // =====================================================
            // PENTING:
            // ISI KOTAK PENCARIAN DENGAN ID DARI URL
            // =====================================================
            if (inputEl) {
                inputEl.value = orderIdInput;
            }
    
            // Tampilkan loading
            if (resultDiv) {
                resultDiv.classList.remove('hidden');
    
                resultDiv.innerHTML = `
                    <div class="text-center py-8 text-slate-500 text-sm bg-slate-50 rounded-2xl border border-slate-100">
                        <i class="fa-solid fa-spinner fa-spin text-2xl mb-3 text-brand-500"></i>
                        <p class="font-medium">Mencari pesanan...</p>
                        <p class="text-xs text-slate-400 mt-1">
                            ${orderIdInput}
                        </p>
                    </div>
                `;
            }
    
            let foundOrder = null;
    
            // =====================================================
            // CARI DI SUPABASE
            // =====================================================
            try {
    
                console.log('[TRACKER] Menunggu Supabase...');
    
                await authReady;
    
                console.log('[TRACKER] Mencari order:', orderIdInput);
    
                const {
                    data,
                    error
                } = await supabase
                    .from('orders')
                    .select('*')
                    .eq('order_id', orderIdInput)
                    .maybeSingle();
    
                console.log('[TRACKER] Supabase data:', data);
                console.log('[TRACKER] Supabase error:', error);
    
                if (error) {
                    console.error('[TRACKER] Supabase error:', error);
                }
    
                if (data) {
                    foundOrder = data;
                }
    
            } catch (error) {
                console.error('[TRACKER] Supabase fetch exception:', error);
            }
    
    
            // =====================================================
            // FALLBACK LOCAL STORAGE
            // =====================================================
            if (!foundOrder) {
                try {
    
                    const localOrders = JSON.parse(
                        localStorage.getItem('local_orders') || '[]'
                    );
    
                    foundOrder = localOrders.find(order => {
                        return String(order.order_id || '')
                            .trim()
                            .toUpperCase() === orderIdInput;
                    });
    
                    console.log('[TRACKER] LocalStorage result:', foundOrder);
    
                } catch (error) {
                    console.error(
                        '[TRACKER] localStorage error:',
                        error
                    );
                }
            }
    
    
            // =====================================================
            // HASIL
            // =====================================================
            if (!resultDiv) return;
    
    
            // =====================================================
            // ORDER DITEMUKAN
            // =====================================================
            if (foundOrder) {
    
                let proofDisplay = '';
    
                if (
                    foundOrder.payment_proof &&
                    foundOrder.payment_proof !== 'Pending / Cash'
                ) {
    
                    if (
                        String(foundOrder.payment_proof)
                            .startsWith('data:image')
                    ) {
    
                        proofDisplay = `
                            <div class="pt-2">
                                <p class="text-xs text-slate-500 mb-1 font-semibold">
                                    Bukti Pembayaran:
                                </p>
    
                                <img
                                    src="${foundOrder.payment_proof}"
                                    class="w-32 h-32 object-cover rounded-xl border border-slate-200"
                                    alt="Bukti Pembayaran"
                                >
                            </div>
                        `;
    
                    } else {
    
                        proofDisplay = `
                            <div class="pt-2">
                                <a
                                    href="${foundOrder.payment_proof}"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    class="text-xs text-brand-600 underline font-semibold"
                                >
                                    Lihat Bukti Pembayaran ↗
                                </a>
                            </div>
                        `;
                    }
                }
    
    
                // =================================================
                // ITEMS
                // =================================================
                const itemsList = Array.isArray(foundOrder.items)
                    ? foundOrder.items.map(item => {
    
                        const nama =
                            item.nama ||
                            item.name ||
                            'Item';
    
                        const qty =
                            Number(item.qty || 0);
    
                        const price =
                            Number(item.price || item.harga || 0);
    
                        return `
                            <div class="flex justify-between text-xs py-1 border-b border-slate-100 last:border-none">
                                <span>
                                    ${nama} (${qty}x)
                                </span>
    
                                <span class="font-medium">
                                    Rp ${formatRupiah(price * qty)}
                                </span>
                            </div>
                        `;
    
                    }).join('')
                    : '-';
    
    
                // =================================================
                // WAKTU ORDER
                // =================================================
                const orderTime = foundOrder.created_at
                    ? new Date(foundOrder.created_at).toLocaleString(
                        'id-ID',
                        {
                            timeZone: 'Asia/Jakarta'
                        }
                    )
                    : '-';
    
    
                // =================================================
                // RENDER
                // =================================================
                resultDiv.innerHTML = `
                    <div class="bg-slate-50 p-5 rounded-2xl space-y-3 text-sm border border-slate-100">
    
                        <div class="flex justify-between items-center pb-2 border-b border-slate-200">
                            <span class="text-slate-500 text-xs">
                                ID Pesanan:
                            </span>
    
                            <span class="font-bold text-slate-900">
                                ${foundOrder.order_id || orderIdInput}
                            </span>
                        </div>
    
    
                        <div class="flex justify-between items-center">
                            <span class="text-slate-500 text-xs">
                                Waktu Pemesanan (WIB):
                            </span>
    
                            <span class="font-medium text-slate-800 text-xs">
                                ${orderTime}
                            </span>
                        </div>
    
    
                        <div class="flex justify-between items-center">
                            <span class="text-slate-500 text-xs">
                                Nama Pemesan:
                            </span>
    
                            <span class="font-semibold text-slate-800">
                                ${foundOrder.customer_name || '-'}
                            </span>
                        </div>
    
    
                        <div class="flex justify-between items-center">
                            <span class="text-slate-500 text-xs">
                                No. WhatsApp:
                            </span>
    
                            <span class="font-medium text-slate-800">
                                ${foundOrder.phone || '-'}
                            </span>
                        </div>
    
    
                        <div class="flex justify-between items-center">
                            <span class="text-slate-500 text-xs">
                                Metode Pembayaran:
                            </span>
    
                            <span class="font-medium text-slate-800">
                                ${foundOrder.payment_method || 'Cash'}
                            </span>
                        </div>
    
    
                        <div class="flex justify-between items-center pb-2 border-b border-slate-200">
    
                            <span class="text-slate-500 text-xs">
                                Status Pesanan:
                            </span>
    
                            <span class="bg-amber-100 text-amber-700 text-xs px-3 py-1 rounded-full font-bold uppercase">
                                ${foundOrder.status || '-'}
                            </span>
    
                        </div>
    
    
                        <div class="pt-1">
    
                            <p class="text-xs text-slate-500 font-semibold mb-1">
                                Rincian Item:
                            </p>
    
                            <div class="bg-white p-3 rounded-xl border border-slate-200 space-y-1">
                                ${itemsList}
                            </div>
    
                        </div>
    
    
                        <div class="flex justify-between items-center pt-2 border-t border-slate-200 font-bold text-base">
    
                            <span class="text-slate-700">
                                Total Harga:
                            </span>
    
                            <span class="text-brand-600">
                                Rp ${formatRupiah(
                                    foundOrder.grand_total ||
                                    foundOrder.total_price
                                )}
                            </span>
    
                        </div>
    
                        ${proofDisplay}
    
                    </div>
                `;
    
    
                console.log(
                    '[TRACKER] Order berhasil ditampilkan:',
                    foundOrder.order_id
                );
    
            }
    
            // =====================================================
            // ORDER TIDAK DITEMUKAN
            // =====================================================
            else {
    
                resultDiv.innerHTML = `
                    <div class="text-center py-8 text-slate-400 text-sm bg-slate-50 rounded-2xl border border-slate-100">
    
                        <i class="fa-solid fa-circle-exclamation text-2xl mb-2 text-amber-500"></i>
    
                        <p>
                            Pesanan dengan ID
                            <b class="text-slate-700">
                                ${orderIdInput}
                            </b>
                            tidak ditemukan.
                        </p>
    
                        <p class="text-xs text-slate-400 mt-1">
                            Pastikan ID pesanan sudah benar.
                        </p>
    
                    </div>
                `;
    
                console.warn(
                    '[TRACKER] Order tidak ditemukan:',
                    orderIdInput
                );
            }
        };
    
    
        // =========================================================
        // AUTO TRACKING
        // =========================================================
        async function autoTrackOrder() {
    
            const orderId = extractOrderIdFromURL();
    
            console.log(
                '[TRACKER] URL:',
                window.location.href
            );
    
            console.log(
                '[TRACKER] Order ID dari URL:',
                orderId
            );
    
            if (!orderId) {
                console.log(
                    '[TRACKER] Tidak ada Order ID di URL.'
                );
                return;
            }
    
            // Pastikan DOM tersedia
            const inputEl =
                document.getElementById('tracker-order-id');
    
            if (inputEl) {
                // AUTO ISI INPUT
                inputEl.value = orderId;
            }
    
            // AUTO SEARCH
            await window.fetchOrderStatus(orderId);
        }
    
    
        // =========================================================
        // JALANKAN AUTO SEARCH
        // Tidak hanya mengandalkan DOMContentLoaded
        // =========================================================
        if (document.readyState === 'loading') {
    
            document.addEventListener(
                'DOMContentLoaded',
                autoTrackOrder,
                { once: true }
            );
    
        } else {
    
            autoTrackOrder();
    
        }
    
    </script>
</body>
</html>
