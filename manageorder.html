<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Pesanan - ChimChum Malang</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fff5f0',
                            100: '#ffedd5',
                            500: '#ff6b35',
                            600: '#ea580c',
                            700: '#c2410c'
                        }
                    }
                }
            }
        };
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        body { font-family: 'Poppins', sans-serif; }
        .modal-backdrop { background: rgba(15, 23, 42, .58); backdrop-filter: blur(3px); }
        .table-scroll::-webkit-scrollbar { height: 8px; }
        .table-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 99px; }
    </style>
</head>

<body class="bg-slate-50 text-slate-800 min-h-screen">

    <nav class="bg-white sticky top-0 z-30 border-b border-slate-200 shadow-sm">
        <div class="max-w-[1500px] mx-auto px-4 sm:px-6 h-16 flex items-center">
            
            <!-- BRAND -->
            <div class="flex items-center gap-3 min-w-0">
                <div class="w-10 h-10 rounded-xl bg-brand-50 flex items-center justify-center overflow-hidden shrink-0">
                    <img
                        src="./assets/logo-transparan.png"
                        alt="Logo"
                        class="max-w-full max-h-full"
                        onerror="this.style.display='none'"
                    >
                </div>
    
                <div class="min-w-0">
                    <h1 class="font-bold text-slate-900 truncate">
                        ChimChum <span class="text-brand-500">Malang</span>
                    </h1>
    
                    <p class="text-[10px] text-slate-400 font-medium">
                        Manage Pesanan
                    </p>
                </div>
            </div>
    
            <!-- RIGHT ACTIONS -->
            <div class="ml-auto flex items-center gap-2 shrink-0">
    
                <!-- REFRESH -->
                <button
                    type="button"
                    onclick="loadOrders()"
                    class="inline-flex items-center gap-2 px-3.5 py-2.5 rounded-xl
                           bg-slate-100 hover:bg-slate-200
                           border border-slate-200
                           text-slate-700 text-sm font-semibold
                           transition active:scale-[0.98]"
                    title="Refresh pesanan"
                >
                    <i class="fa-solid fa-rotate text-xs"></i>
    
                    <span class="hidden sm:inline">
                        Refresh
                    </span>
                </button>
    
                <!-- DELETE -->
                <button
                    id="deleteOldProofsBtn"
                    type="button"
                    onclick="deleteOldPaymentProofs()"
                    class="inline-flex items-center gap-2 px-3.5 py-2.5 rounded-xl
                           bg-red-50 hover:bg-red-100
                           border border-red-200
                           text-red-600 hover:text-red-700
                           text-sm font-semibold
                           transition active:scale-[0.98]"
                    title="Hapus bukti transfer yang lebih dari 30 hari"
                >
                    <i class="fa-solid fa-trash-can text-xs"></i>
    
                    <span class="hidden sm:inline">
                        Hapus Bukti &gt;30 Hari
                    </span>
                </button>
    
            </div>
        </div>
    </nav>

    <main class="max-w-[1500px] mx-auto px-4 sm:px-6 py-6">

        <!-- SUMMARY -->
        <section id="summaryCards" class="grid grid-cols-2 md:grid-cols-4 xl:grid-cols-7 gap-3 mb-5">
            <!-- rendered by JS -->
        </section>

        <!-- TOOLBAR -->
        <section class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4 mb-4">
            <div class="flex flex-col lg:flex-row gap-3 lg:items-center lg:justify-between">
                <div class="flex-1 relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input id="searchInput"
                           type="search"
                           placeholder="Cari ID pesanan, nama, WhatsApp, alamat..."
                           class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
                </div>

                <div class="flex flex-col sm:flex-row gap-2">
                    <select id="statusFilter"
                            class="px-4 py-3 rounded-xl border border-slate-200 bg-white text-sm font-medium focus:outline-none focus:ring-2 focus:ring-brand-500">
                        <option value="all">Semua Status</option>
                        <option value="new">New</option>
                        <option value="disiapkan">Diproses</option>
                        <option value="dikirim">Dikirim</option>
                        <option value="selesai">Selesai</option>
                        <option value="cancel">Batal</option>
                    </select>

                    <select id="pageSize"
                            class="px-4 py-3 rounded-xl border border-slate-200 bg-white text-sm font-medium focus:outline-none focus:ring-2 focus:ring-brand-500">
                        <option value="10">10 / halaman</option>
                        <option value="20" selected>20 / halaman</option>
                        <option value="50">50 / halaman</option>
                        <option value="100">100 / halaman</option>
                    </select>
                </div>
            </div>

            <div class="mt-3 flex items-center justify-between gap-3 text-xs text-slate-500">
                <span id="resultInfo">Memuat pesanan...</span>
                <button id="clearFilterBtn" type="button"
                        class="hidden text-brand-600 hover:text-brand-700 font-semibold">
                    Reset filter
                </button>
            </div>
        </section>

        <!-- TABLE -->
        <section class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="table-scroll overflow-x-auto">
                <table class="w-full min-w-[1050px] text-sm">
                    <thead class="bg-slate-50 border-b border-slate-200">
                        <tr class="text-left text-[11px] uppercase tracking-wider text-slate-500">
                            <th class="px-4 py-3 font-semibold">Pesanan</th>
                            <th class="px-4 py-3 font-semibold">Pemesan</th>
                            <th class="px-4 py-3 font-semibold">Pembayaran</th>
                            <th class="px-4 py-3 font-semibold">Total</th>
                            <th class="px-4 py-3 font-semibold">Status</th>
                            <th class="px-4 py-3 font-semibold">Waktu</th>
                            <th class="px-4 py-3 font-semibold text-right">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="orderTableBody" class="divide-y divide-slate-100">
                    </tbody>
                </table>
            </div>

            <div id="emptyState" class="hidden py-16 text-center">
                <div class="w-14 h-14 rounded-2xl bg-slate-100 text-slate-400 flex items-center justify-center mx-auto mb-3">
                    <i class="fa-solid fa-inbox text-xl"></i>
                </div>
                <p class="font-semibold text-slate-700">Pesanan tidak ditemukan</p>
                <p class="text-xs text-slate-400 mt-1">Coba ubah pencarian atau filter.</p>
            </div>

            <!-- PAGINATION -->
            <div class="border-t border-slate-200 px-4 py-3 flex flex-col sm:flex-row items-center justify-between gap-3">
                <div id="paginationInfo" class="text-xs text-slate-500"></div>
                <div id="pagination" class="flex items-center gap-1"></div>
            </div>
        </section>
    </main>

    <!-- DETAIL MODAL -->
    <div id="detailModal" class="hidden fixed inset-0 z-50 modal-backdrop items-center justify-center p-4">
        <div class="bg-white w-full max-w-2xl max-h-[90vh] overflow-y-auto rounded-3xl shadow-2xl">
            <div class="sticky top-0 bg-white border-b border-slate-100 px-5 py-4 flex items-center justify-between">
                <div>
                    <h2 class="font-bold text-slate-900">Detail Pesanan</h2>
                    <p id="detailOrderId" class="text-xs text-slate-400 mt-0.5"></p>
                </div>
                <button onclick="closeModal('detailModal')" class="w-9 h-9 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div id="detailContent" class="p-5"></div>
        </div>
    </div>

    <!-- PROOF MODAL -->
    <div id="proofModal" class="hidden fixed inset-0 z-[60] modal-backdrop items-center justify-center p-4">
        <div class="bg-white w-full max-w-3xl rounded-3xl shadow-2xl overflow-hidden">
            <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between">
                <div>
                    <h2 class="font-bold text-slate-900">Bukti Pembayaran</h2>
                    <p id="proofOrderId" class="text-xs text-slate-400 mt-0.5"></p>
                </div>
                <button onclick="closeModal('proofModal')" class="w-9 h-9 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div id="proofContent" class="p-5 flex items-center justify-center min-h-[300px]"></div>
        </div>
    </div>

    <script type="module" src="./js/module/manage-order.js"></script>
</body>
</html>
